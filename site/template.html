/* ── сама админка ─────────────────────────────────────────────────── */
const Admin = ({ onLogout }) => {
  const [tab, setTab] = useState('page');
  const [page, setPage] = useState(null);
  const [saved, setSaved] = useState('');
  const [editing, setEditing] = useState(true);
  const [pending, setPending] = useState(false);
  const [saving, setSaving] = useState(false);
  const [loadErr, setLoadErr] = useState('');
  const [toast, setToast] = useState(null);
  const [lib, setLib] = useState(null);
  const [layers, setLayers] = useState(false);
  const [versions, setVersions] = useState(false);
  const [mobile, setMobile] = useState(false);
  const [bar, setBar] = useState(null);
  const [newLeads, setNewLeads] = useState(0);
  const [dragId, setDragId] = useState(null);
  const [drop, setDrop] = useState(null);
  const [, bump] = useState(0);
  const pageRef = useRef(null);
  const hist = useRef({ past: [], future: [] });
  const lists = useRef({}).current;
  const ghost = useRef(null);

  const say = (text, kind) => setToast({ text, kind: kind || 'ok', at: Date.now() });
  useEffect(() => {
    if (!toast) return undefined;
    const t = setTimeout(() => setToast(null), toast.kind === 'error' ? 4600 : 2800);
    return () => clearTimeout(t);
  }, [toast]);
  const fail = e => { if (e && e.auth) { onLogout(); return; } say(errText(e), 'error'); };

  const put = p => { pageRef.current = p; setPage(p); };

  useEffect(() => {
    api('content')
      .then(j => { const p = cleanPage(j.page) || defaultPage(); put(p); setSaved(JSON.stringify(p)); })
      .catch(e => { if (e.auth) onLogout(); else setLoadErr(errText(e)); });
    api('leads').then(j => setNewLeads(j.leads.filter(l => l.status === 'new').length)).catch(() => {});
  }, []);

  /* любое изменение: копия страницы → правка → старая версия в историю */
  const change = fn => {
    const cur = pageRef.current;
    if (!cur) return;
    const next = clone(cur);
    if (fn(next) === false) return;
    if (JSON.stringify(next) === JSON.stringify(cur)) return;
    const h = hist.current;
    h.past.push(cur);
    if (h.past.length > 100) h.past.shift();
    h.future = [];
    put(next);
  };
  const undo = () => {
    const h = hist.current;
    if (!h.past.length) return;
    h.future.unshift(pageRef.current);
    put(h.past.pop());
    bump(x => x + 1);
  };
  const redo = () => {
    const h = hist.current;
    if (!h.future.length) return;
    h.past.push(pageRef.current);
    put(h.future.shift());
    bump(x => x + 1);
  };

  const dataOf = (p, id) => {
    if (id === 'chrome') return p.chrome;
    const b = p.blocks.find(x => x.id === id);
    return b ? b.data : null;
  };
  /* список из вёрстки становится своим при первой правке любого пункта */
  const own = (id, d, key) => {
    if (d[key] === undefined && lists[id + '/' + key]) d[key] = clone(lists[id + '/' + key]);
    return Array.isArray(d[key]) ? d[key] : null;
  };

  const fns = {
    setText: (id, path, value) => {
      setPending(false);
      change(p => {
        const d = dataOf(p, id);
        if (!d) return false;
        const head = String(path).split('.')[0];
        if (String(path).indexOf('.') > 0) own(id, d, head);
        if (value === undefined) {
          if (String(path).indexOf('.') > 0) return false;
          delete d[path];
          return undefined;
        }
        setPath(d, path, value);
        return undefined;
      });
    },
    listAdd: (id, key, make) => change(p => {
      const d = dataOf(p, id);
      const list = d && own(id, d, key);
      if (!list) return false;
      list.push(make());
      return undefined;
    }),
    listRemove: (id, key, i) => change(p => {
      const d = dataOf(p, id);
      const list = d && own(id, d, key);
      if (!list) return false;
      if (list.length <= 1) { say('Последний пункт не удалить — лучше скройте весь блок', 'error'); return false; }
      list.splice(i, 1);
      return undefined;
    }),
    listMove: (id, key, i, dir) => change(p => {
      const d = dataOf(p, id);
      const list = d && own(id, d, key);
      const j = i + dir;
      if (!list || j < 0 || j >= list.length) return false;
      const t = list[i]; list[i] = list[j]; list[j] = t;
      return undefined;
    }),
    openBar: b => {
      // место плашки считаем сразу: после сохранения текста поле перерисуется
      const r = b.el.getBoundingClientRect();
      setBar(Object.assign({}, b, {
        anchor: b.el.closest('a'),
        top: r.bottom + window.pageYOffset + 10,
        left: Math.max(12, Math.min(r.left + window.pageXOffset,
          window.pageXOffset + document.documentElement.clientWidth - 384)),
      }));
    },
    touch: on => setPending(on !== false),
    say, fail,
  };
  const fnRef = useRef(fns);
  fnRef.current = fns;
  const ed = React.useMemo(() => ({
    editing, lists,
    setText: (a, b, c) => fnRef.current.setText(a, b, c),
    listAdd: (a, b, c) => fnRef.current.listAdd(a, b, c),
    listRemove: (a, b, c) => fnRef.current.listRemove(a, b, c),
    listMove: (a, b, c, d) => fnRef.current.listMove(a, b, c, d),
    openBar: b => fnRef.current.openBar(b),
    touch: on => fnRef.current.touch(on),
    say: (a, b) => fnRef.current.say(a, b),
    fail: e => fnRef.current.fail(e),
  }), [editing]);

  /* ── блоки ── */
  const newId = type => type.replace(/_/g, '-') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const jump = id => {
    const el = document.querySelector('[data-blk="' + id + '"]');
    if (!el) return;
    // верх блока с его панелью не должен прятаться под шапкой админки и шапкой сайта
    const head = document.querySelector('.adm-page .top');
    const off = 56 + (head ? head.offsetHeight : 0) + 28;
    window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - off, behavior: 'smooth' });
  };
  const moveTo = (id, index) => change(p => {
    const from = p.blocks.findIndex(b => b.id === id);
    if (from < 0) return false;
    let to = index;
    if (to > from) to -= 1;
    if (to === from) return false;
    p.blocks.splice(to, 0, p.blocks.splice(from, 1)[0]);
    return undefined;
  });
  const shift = (i, dir) => change(p => {
    const j = i + dir;
    if (j < 0 || j >= p.blocks.length) return false;
    const t = p.blocks[i]; p.blocks[i] = p.blocks[j]; p.blocks[j] = t;
    return undefined;
  });
  const dup = i => {
    change(p => { const b = clone(p.blocks[i]); b.id = newId(b.type); p.blocks.splice(i + 1, 0, b); });
    say('Блок продублирован — копия стоит сразу под ним');
  };
  const toggleHide = id => change(p => {
    const b = p.blocks.find(x => x.id === id);
    if (!b) return false;
    b.hidden = !b.hidden;
    return undefined;
  });
  const resetBlock = i => {
    if (!window.confirm('Вернуть блоку исходные тексты, пункты и картинки?')) return;
    change(p => { p.blocks[i].data = {}; });
  };
  const remove = i => {
    const name = BLOCKS[pageRef.current.blocks[i].type].name;
    change(p => { p.blocks.splice(i, 1); });
    say('Блок «' + name + '» удалён. Вернуть — Ctrl+Z');
  };
  const insert = type => {
    const at = lib == null ? pageRef.current.blocks.length : lib;
    const id = newId(type);
    setLib(null);
    change(p => { p.blocks.splice(at, 0, { id, type, data: {} }); });
    setTimeout(() => jump(id), 60);
  };

  /* ── перетаскивание прямо на странице ── */
  /* кого тащим — держим в ref: события перетаскивания приходят раньше,
     чем React успевает перерисовать состояние */
  const dragRef = useRef(null);
  const startDrag = (e, id, name) => {
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', id); } catch (err) { /* старые браузеры */ }
    if (ghost.current) { ghost.current.textContent = name; e.dataTransfer.setDragImage(ghost.current, 18, 18); }
    dragRef.current = id;
    setBar(null);
    setDragId(id);
  };
  const endDrag = () => { dragRef.current = null; setDragId(null); setDrop(null); };
  const dropIndex = (e, i) => {
    const r = e.currentTarget.getBoundingClientRect();
    return e.clientY < r.top + r.height / 2 ? i : i + 1;
  };
  const over = (e, i) => {
    if (!dragRef.current) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const idx = dropIndex(e, i);
    if (idx !== drop) setDrop(idx);
  };
  const dropHere = (e, i) => {
    if (!dragRef.current) return;
    e.preventDefault();
    moveTo(dragRef.current, dropIndex(e, i));
    endDrag();
  };
  useEffect(() => {
    if (!dragId) return undefined;
    // у края окна страница сама едет — блок можно утащить далеко
    const onOver = e => {
      if (e.clientY < 130) window.scrollBy(0, -26);
      else if (e.clientY > window.innerHeight - 70) window.scrollBy(0, 26);
    };
    document.addEventListener('dragover', onOver);
    return () => document.removeEventListener('dragover', onOver);
  }, [dragId]);

  /* ── сохранение ── */
  const dirty = !!page && (pending || JSON.stringify(page) !== saved);
  const save = () => {
    const a = document.activeElement;
    if (a && a.isContentEditable) a.blur();
    const cur = pageRef.current;
    if (!cur || saving) return;
    if (JSON.stringify(cur) === saved) { setPending(false); return; }
    setSaving(true);
    api('save', { pageJson: JSON.stringify(cur) })
      .then(() => { setSaved(JSON.stringify(cur)); setPending(false); say('Сохранено. Сайт уже показывает новую версию'); })
      .catch(fail).then(() => setSaving(false));
  };

  useEffect(() => {
    const onKey = e => {
      if (!(e.ctrlKey || e.metaKey) || tab !== 'page') return;
      const k = (e.key || '').toLowerCase();
      const a = document.activeElement;
      const typing = a && (a.isContentEditable || a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
      if (k === 's' || k === 'ы') { e.preventDefault(); save(); return; }
      if (typing) return;
      if ((k === 'z' || k === 'я') && !e.shiftKey) { e.preventDefault(); undo(); }
      else if (k === 'y' || k === 'н' || ((k === 'z' || k === 'я') && e.shiftKey)) { e.preventDefault(); redo(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  useEffect(() => {
    const onLeave = e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', onLeave);
    return () => window.removeEventListener('beforeunload', onLeave);
  }, [dirty]);

  /* в режиме правки ссылки не уводят со страницы, а формы не отправляются */
  useEffect(() => {
    if (!editing || tab !== 'page') return undefined;
    const onClick = e => { if (e.target.closest && e.target.closest('.adm-page a')) e.preventDefault(); };
    const onSubmit = e => { if (e.target.closest && e.target.closest('.adm-page')) e.preventDefault(); };
    document.addEventListener('click', onClick, true);
    document.addEventListener('submit', onSubmit, true);
    return () => {
      document.removeEventListener('click', onClick, true);
      document.removeEventListener('submit', onSubmit, true);
    };
  }, [editing, tab]);

  const chrome = React.useMemo(() => ({ id: 'chrome', data: page ? page.chrome : {} }), [page && page.chrome]);
  const h = hist.current;

  const blocksView = page && page.blocks.map((b, i) => {
    if (!editing && b.hidden) return null;
    const def = BLOCKS[b.type];
    const B = def.C;
    const body = <BlockCtx.Provider value={b}><B /></BlockCtx.Provider>;
    if (!editing) return <React.Fragment key={b.id}>{body}</React.Fragment>;
    const cls = 'adm-blk' + (b.hidden ? ' is-hidden' : '') + (dragId === b.id ? ' is-drag' : '')
      + (drop === i ? ' drop-before' : '') + (drop === i + 1 && i === page.blocks.length - 1 ? ' drop-after' : '');
    return (
      <div key={b.id} className={cls} data-blk={b.id} onDragOver={e => over(e, i)} onDrop={e => dropHere(e, i)}>
        <div className="adm-bar" data-adm-ui>
          <span className="adm-grip" draggable title="Потяните, чтобы переставить блок"
                onDragStart={e => startDrag(e, b.id, def.name)} onDragEnd={endDrag}>
            <AI n="grip" />
          </span>
          <span className="adm-bar-name">{def.name}</span>
          {b.hidden && <span className="adm-badge">Скрыт</span>}
          <span className="adm-bar-sep" />
          <button type="button" title="Выше" disabled={i === 0} onClick={() => shift(i, -1)}><AI n="up" /></button>
          <button type="button" title="Ниже" disabled={i === page.blocks.length - 1} onClick={() => shift(i, 1)}><AI n="down" /></button>
          <button type="button" title="Дублировать" onClick={() => dup(i)}><AI n="copy" /></button>
          <button type="button" title={b.hidden ? 'Показать на сайте' : 'Скрыть с сайта'} onClick={() => toggleHide(b.id)}>
            <AI n={b.hidden ? 'eyeOff' : 'eye'} />
          </button>
          <button type="button" title="Вернуть исходные тексты" onClick={() => resetBlock(i)}><AI n="reset" /></button>
          <button type="button" className="del" title="Удалить блок" onClick={() => remove(i)}><AI n="trash" /></button>
        </div>
        {body}
        <button type="button" className="adm-ins" data-adm-ui title="Добавить блок сюда" onClick={() => setLib(i + 1)}>
          <AI n="plus" />Блок
        </button>
      </div>
    );
  });

  const closeText = () => { const a = document.activeElement; if (a && a.isContentEditable) a.blur(); };

  return (
    <EditCtx.Provider value={tab === 'page' && page ? ed : null}>
      <div className={'adm-root' + (tab === 'page' ? ' is-page' : ' is-leads')}>
        <header className="adm-top">
          <div className="adm-brand"><img src={LOGO} alt="AppForse" /><span>Админка</span></div>
          <nav className="adm-tabs">
            <button type="button" className={tab === 'page' ? 'on' : ''} onClick={() => setTab('page')}>
              <AI n="page" /><span className="adm-lbl">Страница</span>
            </button>
            <button type="button" className={tab === 'leads' ? 'on' : ''} onClick={() => { closeText(); setBar(null); setTab('leads'); }}>
              <AI n="inbox" /><span className="adm-lbl">Заявки</span>{newLeads > 0 && <i className="adm-count">{newLeads}</i>}
            </button>
          </nav>
          {tab === 'page' && page ? (
            <div className="adm-tools">
              <div className="adm-seg" role="group" aria-label="Режим">
                <button type="button" className={editing ? 'on' : ''} onClick={() => setEditing(true)}>
                  <AI n="pencil" /><span className="adm-lbl">Правка</span>
                </button>
                <button type="button" className={!editing ? 'on' : ''} onClick={() => { closeText(); setBar(null); setEditing(false); }}>
                  <AI n="eye" /><span className="adm-lbl">Просмотр</span>
                </button>
              </div>
              <span className="adm-divider" />
              <button type="button" className="adm-icon-btn" title="Отменить · Ctrl+Z" disabled={!h.past.length} onClick={undo}><AI n="undo" /></button>
              <button type="button" className="adm-icon-btn" title="Повторить · Ctrl+Shift+Z" disabled={!h.future.length} onClick={redo}><AI n="redo" /></button>
              <span className="adm-divider" />
              <button type="button" className={'adm-icon-btn' + (layers ? ' on' : '')} title="Структура страницы" onClick={() => setLayers(v => !v)}><AI n="layers" /></button>
              <button type="button" className="adm-icon-btn" title="Мобильная версия" onClick={() => { closeText(); setMobile(true); }}><AI n="phone" /></button>
              <button type="button" className="adm-icon-btn" title="История сохранений" onClick={() => setVersions(true)}><AI n="history" /></button>
              <a className="adm-icon-btn" href="index.html" target="_blank" rel="noopener" title="Открыть сайт в новой вкладке"><AI n="external" /></a>
              <button type="button" className={'adm-btn primary adm-save' + (dirty ? ' is-dirty' : '')}
                      disabled={!dirty || saving} onMouseDown={e => e.preventDefault()} onClick={save} title="Ctrl+S">
                {saving ? 'Сохраняем…' : dirty ? 'Сохранить' : 'Сохранено'}
              </button>
            </div>
          ) : <div className="adm-tools" />}
          <button type="button" className="adm-icon-btn" title="Выйти"
                  onClick={() => { if (dirty && !window.confirm('Есть несохранённые изменения. Выйти без сохранения?')) return; onLogout(); }}>
            <AI n="logout" />
          </button>
        </header>

        {tab === 'leads' ? <Leads fail={fail} onCount={setNewLeads} />
          : !page ? <div className="adm-state">{loadErr || 'Загружаем страницу…'}</div>
          : (
            <div className={'adm-page' + (editing ? ' adm-edit' : '')}>
              <ParticleField />
              <BlockCtx.Provider value={chrome}><Top /></BlockCtx.Provider>
              <main>{blocksView}</main>
              {editing && (
                <div className="adm-end" data-adm-ui>
                  <button type="button" className="adm-btn" onClick={() => setLib(page.blocks.length)}><AI n="plus" />Добавить блок в конец</button>
                </div>
              )}
              <BlockCtx.Provider value={chrome}><Foot /></BlockCtx.Provider>
            </div>
          )}

        {tab === 'page' && page && layers && (
          <Layers page={page} onClose={() => setLayers(false)} onMove={moveTo} onJump={jump} onHide={toggleHide} />
        )}
        {lib != null && <Library onPick={insert} onClose={() => setLib(null)} />}
        {versions && (
          <Versions fail={fail} onClose={() => setVersions(false)}
                    onOpen={p => {
                      const c = cleanPage(p);
                      if (!c) { say('Эта версия повреждена и не открывается', 'error'); return; }
                      change(x => { x.chrome = c.chrome; x.blocks = c.blocks; });
                      say('Версия открыта в редакторе. Чтобы вернуть её на сайт — «Сохранить»');
                    }} />
        )}
        {mobile && page && <MobilePreview page={page} onClose={() => setMobile(false)} />}
        {bar && tab === 'page' && editing && page && (
          <FloatBar key={bar.kind + '|' + bar.blk + '|' + bar.k} bar={bar}
                    value={bar.kind === 'link'
                      ? (bar.anchor ? bar.anchor.getAttribute('href') : '')
                      : bar.value}
                    onCommit={v => {
                      const t = String(v).trim();
                      if (bar.kind === 'link') {
                        if (t && (!bar.anchor || bar.anchor.getAttribute('href') !== t)) fns.setText(bar.blk, bar.k, t);
                      } else if (t && t !== bar.value) {
                        fns.setText(bar.blk, bar.k, typo(t));
                      }
                    }}
                    onClose={() => setBar(null)} />
        )}
        {toast && <div key={toast.at} className={'adm-toast ' + toast.kind} role="status">{toast.text}</div>}
        <div ref={ghost} className="adm-ghost" aria-hidden="true" />
      </div>
    </EditCtx.Provider>
  );
};

const AdminApp = () => {
  const [token, setToken] = useState(() => store.get(TOKEN_KEY));
  if (!token) return <Login onToken={t => { store.set(TOKEN_KEY, t); setToken(t); }} />;
  return <Admin onLogout={() => { store.del(TOKEN_KEY); setToken(null); }} />;
};
/*ADMIN:END*/

/* Страницу рисуем, когда шрифты уже скачаны и пришли правки из админки.
   Иначе текст на долю секунды появляется запасным шрифтом и «прыгает»,
   или сначала мелькает старый текст. Дольше 2,5 с не ждём — на плохом
   интернете лучше показать страницу как есть, а правки подставить следом. */
/* ждём кириллицу и латиницу первого экрана; ₽ живёт в отдельном файле
   шрифта и догружается следом — ради него держать страницу пустой незачем */
const SITE_FONTS = [
  ['400 16px Manrope', 'Ая Az'],
  ['500 16px Oswald',  'Ая Az'],
  ['600 16px Oswald',  'Ая Az'],
  ['700 16px Oswald',  'Ая Az'],
];
/*ADMIN:START*/
if (IS_ADMIN) {
  ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
} else
/*ADMIN:END*/
{
  const fontsReady = document.fonts && document.fonts.load
    ? Promise.all(SITE_FONTS.map(([f, s]) => document.fonts.load(f, s))).catch(() => {})
    : Promise.resolve();
  const contentReady = (window.fetch
    ? fetch(CONTENT_URL, { mode: 'cors', credentials: 'omit', cache: 'no-cache' })
        .then(r => (r.ok ? r.json() : null)).then(cleanPage).catch(() => null)
    : Promise.resolve(null));
  contentReady.then(p => {
    loadedPage = p;
    if (p && window.__setPage) window.__setPage(p);
  });
  /* правки из админки ждём коротко: на медленном интернете лучше показать
     страницу сразу, а правки подставить, как только ответит сервер */
  const contentSoon = Promise.race([contentReady, new Promise(r => setTimeout(r, 900))]);
  Promise.race([Promise.all([fontsReady, contentSoon]), new Promise(r => setTimeout(r, 2500))])
    .then(() => ReactDOM.createRoot(document.getElementById('root'))
      .render(<App initial={loadedPage || defaultPage()} />));
}
</script>

<script>
// ===== Плавный скролл как в Tilda (алгоритм smoothscroll с «пульсом») =====
(function(){
  if(window.matchMedia && (window.matchMedia('(prefers-reduced-motion: reduce)').matches || window.matchMedia('(pointer: coarse)').matches)) return;

  // --- настройки (как в Tilda) ---
  var animationTime    = 800;  // время скролла (ms)
  var stepSize         = 60;   // размер шага в пикселях
  var accelerationMax  = 1;    // ускорение: 1 = выкл (скорость как раньше), >1 = разгон при быстрой прокрутке
  var accelerationDelta = 50;  // окно (ms), внутри которого срабатывает ускорение

  var pulseScale = 4, pulseNormalize = 1;
  var que = [], pending = false, lastScroll = Date.now();

  function pulse_(x){
    var val, start, expx;
    x = x * pulseScale;
    if(x < 1){ val = x - (1 - Math.exp(-x)); }
    else { start = Math.exp(-1); x -= 1; expx = 1 - Math.exp(-x); val = start + (expx * (1 - start)); }
    return val * pulseNormalize;
  }
  function pulse(x){
    if(x >= 1) return 1;
    if(x <= 0) return 0;
    if(pulseNormalize == 1){ pulseNormalize /= pulse_(1); }
    return pulse_(x);
  }
  function scrollArray(top){
    // ускорение при частой прокрутке
    var now = Date.now(), elapsed = now - lastScroll;
    lastScroll = now;
    if(accelerationMax != 1 && elapsed < accelerationDelta){
      var factor = 1 + (1 - elapsed / accelerationDelta) * (accelerationMax - 1);
      if(factor > accelerationMax) factor = accelerationMax;
      top *= factor;
    }
    que.push({ y: top, lastY: (top < 0) ? 0.99 : -0.99, start: Date.now() });
    if(pending) return;
    function step(){
      var t = Date.now(), scrollY = 0;
      for(var i = 0; i < que.length; i++){
        var item = que[i];
        var el = t - item.start;
        var finished = (el >= animationTime);
        var position = finished ? 1 : el / animationTime;
        position = pulse(position);
        var y = (item.y * position - item.lastY) | 0;
        scrollY += y; item.lastY += y;
        if(finished){ que.splice(i, 1); i--; }
      }
      if(scrollY) window.scrollBy(0, scrollY);
      if(que.length){ requestAnimationFrame(step); } else { pending = false; }
    }
    requestAnimationFrame(step);
    pending = true;
  }
  function onWheel(e){
    // не трогаем: зум (ctrl+wheel) и когда открыт попап/меню (body overflow:hidden)
    if(e.ctrlKey || document.body.style.overflow === 'hidden') return;
    // окна админки прокручиваются сами, страницу под ними не трогаем
    if(e.target.closest && e.target.closest('[data-own-scroll]')) return;
    var d = e.deltaY;
    if(e.deltaMode === 1) d *= 40;                 // строки → пиксели
    else if(e.deltaMode === 2) d *= window.innerHeight;
    if(!d) return;
    e.preventDefault();
    scrollArray(d * stepSize / 100);               // 1 деление колеса ≈ stepSize px
  }
  window.addEventListener('wheel', onWheel, { passive:false });
})();

// ===== якоря доводим сами: CSS-плавность выключена =====
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented) return;
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    var id = a.getAttribute('href');
    if (!id || id === '#') return;
    var el = document.querySelector(id);
    if (!el) return;
    e.preventDefault();
    var head = document.querySelector('.top');
    var off = (head ? head.offsetHeight : 0) + 6;
    var y = el.getBoundingClientRect().top + window.pageYOffset - off;
    window.scrollTo({ top: y < 0 ? 0 : y, behavior: reduce ? 'auto' : 'smooth' });
    if (history.replaceState) history.replaceState(null, '', id);
  });
})();
</script>
