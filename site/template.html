<style>
/* ═══════════════════════════════════════════════════════════
   ДИЗАЙН-СИСТЕМА APPFORSE
   Снята с макета 1920×1400. Все размеры масштабируются от него.
   ═══════════════════════════════════════════════════════════ */
:root {
  /* ── цвет ── */
  --ink:        #0E0C10;   /* основной фон */
  --ink-lift:   #16141A;   /* поверхность на тёмном */
  --ink-line:   #262626;   /* плашки, границы */
  --paper:      #FFFFFF;
  --muted:      #929292;   /* приглушённый текст на плашке */
  --muted-lo:   #A9A9BA;   /* текст на тёмном */
  --muted-hi:   #82828F;   /* мелкие подписи: светлее прежнего #6E6E7A — тот давал
                              контраст 3.86 при норме 4.5, подписи в подвале не читались */
  --red:        #E8243C;
  --red-dk:     #B3182C;
  --red-lt:     #FF5468;
  --on-red:     #FFFFFF;   /* был белый с прозрачностью .88 — контраст 3.68 на красном */

  /* ── типографика: опорные значения при 1920, ниже масштабируются ── */
  --fs-h1:   clamp(32px, 3.54vw, 65px);
  --fs-h2:   clamp(24px, 2.29vw, 44px);
  --fs-h3:   clamp(16px, 1.09vw, 21px);   /* подзаголовок — один размер на весь сайт */
  --fs-h4:   clamp(16px, 1.09vw, 21px);
  --fs-num:  clamp(24px, 1.77vw, 34px);
  --fs-lead: clamp(15px, 0.89vw, 17px);
  --fs-body: clamp(14px, 0.78vw, 15px);
  --fs-cap:  clamp(12px, 0.68vw, 13px);
  --fs-nav:  clamp(12px, 0.78vw, 15px);

  /* ширины текстовых колонок — из макета */
  --w-h1: 730px;
  --w-h2: clamp(320px, 31.25vw, 600px);
  --w-lead: clamp(260px, 22.9vw, 440px);
  --w-lead-wide: clamp(280px, 35.4vw, 680px);   /* подводка секции: строка длиннее — строк меньше */

  /* у Oswald ножки «Д» и краткая над «Й» выходят за строку: при .96 они
     задевали соседние строки, поэтому шаг чуть больше макетного */
  --lh-tight: 1.06;
  --lh-head:  1.1;
  --lh-text:  1.5;

  /* ── шаг сетки: кратно 4 ── */
  --s1: 4px;   --s2: 8px;   --s3: 12px;  --s4: 16px;
  --s5: 20px;  --s6: 24px;  --s8: 32px;  --s10: 40px;
  --s12: 48px; --s16: 64px; --s20: 80px; --s25: 100px;
  --gap-block: clamp(56px, 5.2vw, 100px);   /* отступ между блоками */
  --gap-dark:  clamp(46px, 4.7vw, 90px);    /* между блоками на тёмном — плотнее */

  /* ── сетка ── */
  --shell: 1505px;
  --shot-w: clamp(160px, 19.5vw, 380px);    /* высота держится через aspect-ratio самой картинки */
  --shot-gap: clamp(14px, 1.04vw, 20px);

  --ease: cubic-bezier(.22,.61,.36,1);
}

*, *::before, *::after { box-sizing: border-box; }
/* scroll-behavior: smooth здесь нельзя — конфликтует с плавным скроллом
   на колесе, страница начинает еле ползти. Якоря доводим сами, на JS. */
html { scroll-behavior: auto; scroll-padding-top: 100px; }
body {
  margin: 0; background: var(--ink); color: var(--paper);
  font-family: Manrope, system-ui, sans-serif; font-size: var(--fs-body);
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--red-lt); outline-offset: 3px; }

h1, h2, h3, .display {
  font-family: Oswald, 'Arial Narrow', sans-serif;
  text-transform: uppercase; text-wrap: balance;
  margin: 0; font-weight: 700; letter-spacing: 0;
}
h1 { font-size: var(--fs-h1); line-height: var(--lh-tight); letter-spacing: -.025em; }
h2 { font-size: var(--fs-h2); line-height: var(--lh-tight); letter-spacing: -.02em;
  max-width: var(--w-h2); }
h2.wide { max-width: clamp(360px, 46.9vw, 900px); }
h3 { font-size: var(--fs-h3); line-height: var(--lh-head); font-weight: 600; }
p  { margin: 0; }
.lead { font-size: var(--fs-lead); line-height: var(--lh-text); color: var(--muted-lo); }
p, li, .lead { text-wrap: pretty; }

.shell { width: min(var(--shell), calc(100% - clamp(40px, 4.2vw, 80px))); margin: 0 auto; }

/* ── плашка-эйбрау ── */
.eyebrow {
  display: inline-block; background: var(--ink-line); color: var(--muted);
  font-family: Oswald, sans-serif; font-size: var(--fs-cap); font-weight: 500;
  letter-spacing: .05em; text-transform: uppercase;
  padding: 12px 22px 11px; line-height: 1;
}
.eyebrow.on-red { background: rgba(0,0,0,.22); color: rgba(255,255,255,.72); }

/* ── кнопки ── */
.btn {
  font-family: Oswald, sans-serif; font-size: clamp(13px, .78vw, 15px); font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
  height: clamp(46px, 3.02vw, 58px); padding: 0 clamp(20px, 1.77vw, 34px);
  display: inline-flex; align-items: center; justify-content: center;
  border: 2px solid var(--red); background: var(--red); color: var(--paper);
  transition: background .2s var(--ease), border-color .2s var(--ease),
              transform .2s var(--ease), box-shadow .2s var(--ease);
  text-decoration: none;
}
.btn-ico { width: 18px; height: 18px; flex: none; margin-right: 10px; }
.btn:hover { background: var(--red-dk); border-color: var(--red-dk);
  transform: translateY(-2px); box-shadow: 0 8px 22px rgba(232,36,60,.34); }
.btn:active { transform: translateY(0); }
.btn.ghost { background: transparent; border-color: #373745; color: var(--paper); }
.btn.ghost:hover { background: transparent; border-color: var(--paper); box-shadow: none; }
.btn.on-red { background: var(--paper); border-color: var(--paper); color: var(--red); }
.btn.on-red:hover { background: var(--ink); border-color: var(--ink); color: var(--paper);
  box-shadow: 0 8px 22px rgba(0,0,0,.24); }

/* ── появление при прокрутке ── */
.rise { opacity: 0; transform: translateY(26px); }
.rise.seen { opacity: 1; transform: none;
  transition: opacity .7s var(--ease), transform .7s var(--ease); }

/* первый экран: сам контейнер виден сразу, а его содержимое выезжает
   поэтапно сверху вниз — один общий триггер .seen, задержки заданы в CSS,
   поэтому порядок детерминирован и «кнопки последними» не выпадают рывком */
.hero .rise.shell { opacity: 1; transform: none; transition: none; }
.hero .shell > div > *,
.hero .shell > .shots {
  opacity: 0; transform: translateY(22px);
  transition: opacity .6s var(--ease), transform .6s var(--ease);
}
.hero .shell.seen > div > *,
.hero .shell.seen > .shots { opacity: 1; transform: none; }
.hero .shell.seen .eyebrow { transition-delay: 0ms; }
.hero .shell.seen h1       { transition-delay: 70ms; }
.hero .shell.seen > .shots { transition-delay: 110ms; }
.hero .shell.seen .lead    { transition-delay: 140ms; }
.hero .shell.seen .acts    { transition-delay: 210ms; }
.hero .shell.seen .facts   { transition-delay: 280ms; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .rise, .rise.seen { opacity: 1; transform: none; transition: none; }
  .hero .shell > div > *, .hero .shell > .shots {
    opacity: 1; transform: none; transition: none; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ═══════════ ШАПКА ═══════════ */
.top {
  position: sticky; top: 0; z-index: 60; background: transparent;
  border-bottom: 1px solid transparent;
  transition: border-color .3s var(--ease), background-color .3s var(--ease);
}
/* пока стоим на первом экране, шапка прозрачная и фон виден во весь экран;
   как только страницу тронули — закрываем её плотным цветом, чтобы знаки
   не мельтешили под меню */
.top.stuck, .top.open { border-bottom-color: #1F1D24; background: var(--ink);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.top .shell { display: flex; align-items: center; gap: var(--s6);
  padding-top: var(--s6); padding-bottom: var(--s6); }
.top .logo { height: clamp(32px, 2.34vw, 45px); width: auto; }
.top nav { margin-left: auto; }
.top nav .inner { display: flex; gap: clamp(14px, 1.2vw, 23px); align-items: center; }
.top nav a {
  font-family: Oswald, sans-serif; font-size: var(--fs-nav); font-weight: 500;
  letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
  text-decoration: none; white-space: nowrap;
  transition: color .2s var(--ease);
}
.top nav a:hover { color: var(--paper); }
@media (max-width: 1100px) { .top nav { display: none; } }

/* ── меню на узких экранах ── */
.burger { display: none; margin-left: auto; width: 46px; height: 46px; flex: none;
  background: none; border: 1px solid #2A2830; cursor: pointer; padding: 0;
  align-items: center; justify-content: center;
  transition: border-color .2s var(--ease), background .2s var(--ease); }
.burger:hover { border-color: var(--red); }
.burger i { display: block; position: relative; width: 20px; height: 2px;
  background: var(--paper); transition: background .2s var(--ease); }
.burger i::before, .burger i::after { content: ''; position: absolute; left: 0;
  width: 20px; height: 2px; background: var(--paper);
  transition: transform .3s var(--ease), top .25s var(--ease); }
.burger i::before { top: -6px; }
.burger i::after { top: 6px; }
.top.open .burger i { background: transparent; }
.top.open .burger i::before { top: 0; transform: rotate(45deg); }
.top.open .burger i::after { top: 0; transform: rotate(-45deg); }

@media (max-width: 1100px) {
  .burger { display: flex; }
  /* закрытое меню не должно оставлять под шапкой ни полосы, ни отступа */
  .top nav { display: grid; position: fixed; inset: 0 0 auto; top: var(--top-h, 94px);
    background: var(--ink); border-bottom: 0 solid #1F1D24;
    padding: 0 clamp(20px, 4.2vw, 40px); gap: 0; margin: 0;
    grid-template-rows: 0fr; overflow: hidden;
    transition: grid-template-rows .35s var(--ease), padding .35s var(--ease);
    max-height: calc(100vh - var(--top-h, 94px)); }
  .top.open nav { padding-block: 8px 22px; border-bottom-width: 1px; }
  .top nav > * { min-height: 0; }
  .top.open nav { grid-template-rows: 1fr; overflow-y: auto; }
  .top nav .inner { display: flex; flex-direction: column; overflow: hidden; }
  .top nav a { font-size: clamp(15px, 4vw, 19px); padding: 15px 0;
    border-bottom: 1px solid #1B1920; color: var(--paper); }
  .top nav a:last-child { border-bottom: 0; }
}

/* ═══════════ 01. ПЕРВЫЙ ЭКРАН ═══════════ */
/* Живой фон всей страницы: знаки и лучи по канвасу.
   Канвас прибит к экрану под содержимым — секции своего фона не задают,
   поэтому он просвечивает везде, кроме красных блоков и плотных карточек. */
.pf { position: fixed; inset: 0; width: 100%; height: 100%;
  display: block; z-index: 0; pointer-events: none;
  opacity: 0; transition: opacity 1.2s var(--ease); }
.pf.on { opacity: 1; }
/* содержимое поверх канваса */
section, .foot { position: relative; z-index: 1; }
@media (prefers-reduced-motion: reduce) { .pf { display: none; } }

.hero .shell {
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  gap: clamp(32px, 4vw, 76px); align-items: start;
  padding-top: clamp(24px, 1.82vw, 35px); padding-bottom: clamp(40px, 2.81vw, 54px);
}
.hero h1 { max-width: var(--w-h1); margin: 10px 0 0; text-wrap: normal; }
.hero .circle { position: relative; display: inline-block; white-space: nowrap; padding: 0 .1em; }
.hero .circle svg { position: absolute; left: -11.3%; top: -34.5%; width: 123.4%; height: 169%;
  overflow: visible; pointer-events: none; }
.hero .circle path {
  fill: none; stroke: var(--red); stroke-width: 2; stroke-linecap: round;
  stroke-dasharray: 470; stroke-dashoffset: 470;
  animation: draw 1.1s var(--ease) .5s forwards;
}
@keyframes draw { to { stroke-dashoffset: 0; } }
.hero .lead { max-width: clamp(462px, 27vw, 520px);
  margin-top: clamp(12px, 1.15vw, 22px); }
.hero .acts { display: flex; flex-wrap: wrap; gap: 12px; margin-top: clamp(16px, 1.25vw, 24px); }
.hero .facts { display: flex; flex-wrap: wrap; gap: clamp(18px, 2.08vw, 40px);
  margin-top: clamp(18px, 1.15vw, 22px); }
.hero .facts b { display: block; font-family: Oswald, sans-serif; font-weight: 600;
  font-size: var(--fs-num); line-height: 1; letter-spacing: .01em; }
.hero .facts span { display: block; margin-top: 6px; font-size: var(--fs-cap); color: var(--muted-hi); }

/* снимки */
.shots { display: flex; gap: var(--shot-gap); justify-content: flex-end; align-items: flex-start;
  margin-top: clamp(-8px, -0.42vw, 0px); }
/* дизайнерские мокапы уже со своим наклоном и тенью — просто вписываем
   картинку по ширине, высоту она держит сама через свои пропорции */
.shot { width: var(--shot-w); line-height: 0; }
.shot img { display: block; width: 100%; height: auto; }
.shot.b { margin-top: 0; }

/* рваный край между секциями */
/* рваный край: SVG прозрачный, красная фигура на нём одна.
   Раньше SVG был залит красным, а тёмная фигура его «отъедала» — при сжатии
   на мобильном кромка не докрывала верх и по стыку шла красная полоска. */
.torn { display: block; width: 100%; height: clamp(30px, 3.1vw, 60px);
  background: transparent; }
.torn path { fill: var(--red); }
.torn.down { margin-bottom: -1px; margin-top: -1px; }
.torn.up { margin-top: -1px; margin-bottom: -1px; }

/* ═══════════ КРАСНАЯ СЕКЦИЯ ═══════════ */
.red { background: var(--red); color: var(--paper); }
.red .lead { color: var(--on-red); }
.red .shell { padding-top: var(--gap-block); padding-bottom: var(--gap-block); }
.red h2 + .lead { margin-top: clamp(16px, 1.35vw, 26px); max-width: var(--w-lead-wide); }

/* карточки на красном */
.deck { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(12px, .89vw, 17px);
  margin-top: clamp(28px, 2.4vw, 46px); }
.card { background: var(--ink); padding: clamp(20px, 1.67vw, 32px);
  transition: transform .3s var(--ease), box-shadow .3s var(--ease); }
.card:hover { transform: translateY(-4px); box-shadow: 0 16px 36px rgba(0,0,0,.28); }
.card .num { display: block; font-family: Oswald, sans-serif; font-weight: 600;
  font-size: clamp(12px, .73vw, 14px); letter-spacing: .1em; color: var(--red-lt); }
.card h3 { margin: clamp(12px, 1vw, 19px) 0 clamp(9px, .73vw, 14px); }
.card p { font-size: var(--fs-body); line-height: var(--lh-text); color: var(--muted-lo); }

/* ═══════════ ТЁМНАЯ СЕКЦИЯ ═══════════ */
.dark .shell { padding-top: var(--gap-dark); padding-bottom: var(--gap-dark); }
.dark h2 + .lead { margin-top: clamp(16px, 1.35vw, 26px); max-width: var(--w-lead-wide); }
.sec-head { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }

/* ── 03. Возможности ── */
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 1.25vw, 24px);
  margin-top: clamp(28px, 2.4vw, 46px); }
.panel { background: var(--ink-lift); border: 1px solid #1F1D24; padding: clamp(20px, 1.9vw, 36px);
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "head pic" "tags pic" "fill pic";
  gap: clamp(14px, 1.15vw, 22px) clamp(18px, 1.6vw, 30px); align-content: start; }
.panel h3 { grid-area: head; }
.panel .tags { grid-area: tags; align-content: start; }
.panel > p { grid-area: fill; font-size: var(--fs-body); line-height: var(--lh-text);
  color: var(--muted-lo); max-width: 42ch; }
.panel .pic { grid-area: pic; align-self: start; }
.panel .tags { display: flex; flex-wrap: wrap; gap: 8px; }
.panel .tag { font-size: var(--fs-cap); color: var(--muted-lo);
  border: 1px solid #2A2830; padding: 7px 12px; border-radius: 999px; }
.panel .pic { align-self: flex-start; width: clamp(180px, 19vw, 310px); }
.panel .pic .shot, .case .pic .shot { width: 100%; }

/* ── 04. Для кого ── */
.quad { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(12px, 1.04vw, 20px);
  margin-top: clamp(28px, 2.4vw, 46px); }
.who { background: var(--ink-lift); border-left: 3px solid var(--red);
  padding: clamp(20px, 1.67vw, 32px); transition: border-color .3s var(--ease), background .3s var(--ease); }
.who:hover { background: #1B1920; border-left-color: var(--red-lt); }

.who p { margin-top: 12px; font-size: var(--fs-body); line-height: var(--lh-text); color: var(--muted-lo); }

/* ── 05. Как проходит запуск ── */
.steps { margin-top: clamp(28px, 2.4vw, 46px); border-top: 1px solid #1F1D24; }
.step { display: grid; grid-template-columns: clamp(56px, 5vw, 96px) minmax(0, 26ch) 1fr;
  gap: clamp(16px, 2vw, 40px); align-items: baseline;
  padding: clamp(20px, 1.67vw, 32px) 0; border-bottom: 1px solid #1F1D24; }
.step .n { font-family: Oswald, sans-serif; font-weight: 700; font-size: var(--fs-h3);
  color: var(--red); line-height: 1; }

.step p { font-size: var(--fs-body); line-height: var(--lh-text); color: var(--muted-lo); }

/* ── 06. Демо ── */
.demo { display: grid; grid-template-columns: 1fr auto; gap: clamp(24px, 3vw, 56px);
  align-items: center; background: var(--ink-lift); border: 1px solid #1F1D24;
  padding: clamp(24px, 2.6vw, 50px); margin-top: clamp(24px, 2vw, 38px); }
.demo .lead { max-width: 52ch; margin-top: 16px; }

/* ── 07. Кейс ── */
.cases { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 1.25vw, 24px);
  margin-top: clamp(28px, 2.4vw, 46px); }
.case { background: var(--ink-lift); border: 1px solid #1F1D24; padding: clamp(20px, 1.9vw, 36px);
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "kind pic" "head pic" "text pic";
  grid-template-rows: auto auto 1fr;
  column-gap: clamp(18px, 1.6vw, 30px); align-content: start; }
.case .kind { grid-area: kind; }
.case h3 { grid-area: head; }
.case p { grid-area: text; }
.case .pic { grid-area: pic; align-self: start; }
.case .kind { font-family: Oswald, sans-serif; font-size: var(--fs-cap); letter-spacing: .14em;
  text-transform: uppercase; color: var(--red-lt); }
.case h3 { margin: 14px 0 10px; }
.case p { font-size: var(--fs-body); line-height: var(--lh-text); color: var(--muted-lo); }
.case .pic { width: clamp(180px, 19vw, 310px); }

/* ── Слово основателя ── */
.fv { display: grid; grid-template-columns: clamp(240px, 24vw, 380px) minmax(0, 1fr);
  grid-template-areas: "media head" "media body";
  column-gap: clamp(24px, 3.1vw, 60px); align-content: center; }
.fv-media { grid-area: media; align-self: center; }
.fv-head { grid-area: head; align-self: end; }
.fv-body { grid-area: body; align-self: start;
  padding-top: clamp(16px, 1.35vw, 26px); }
.kicker { display: block; font-family: Oswald, sans-serif; font-size: var(--fs-cap);
  letter-spacing: .14em; text-transform: uppercase; color: var(--red-lt);
  margin-bottom: clamp(10px, .94vw, 18px); }

/* обложка + кнопка: пока не нажали, видео на странице нет вовсе.
   Пропорция задана контейнеру, а не картинке: у img заданы HTML-атрибуты
   width/height (для decode без прыжка вёрстки), и вместе с CSS aspect-ratio
   на самой картинке браузер игнорировал пропорцию и растягивал её на всю
   естественную высоту — на мобильном видео съедало экран целиком. */
.fv-open { display: block; position: relative; width: 100%; aspect-ratio: 9 / 16;
  padding: 0; overflow: hidden;
  border: 3px solid var(--paper); background: none; cursor: pointer;
  transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
.fv-open:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(0,0,0,.4); }
.fv-open img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.fv-open::after { content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(14,12,16,.1), rgba(14,12,16,.5)); }
.fv-vid { display: block; width: 100%; aspect-ratio: 9 / 16; object-fit: cover;
  border: 3px solid var(--paper); background: #000; }
/* на весь экран: показываем кадр целиком, по бокам чёрные поля */
.fv-vid:fullscreen { width: 100%; height: 100%; aspect-ratio: auto;
  object-fit: contain; border: 0; background: #000; }
.fv-vid:-webkit-full-screen { width: 100%; height: 100%; aspect-ratio: auto;
  object-fit: contain; border: 0; background: #000; }
.fv-vid:-moz-full-screen { width: 100%; height: 100%; aspect-ratio: auto;
  object-fit: contain; border: 0; background: #000; }
.fv-vid:-ms-fullscreen { width: 100%; height: 100%; aspect-ratio: auto;
  object-fit: contain; border: 0; background: #000; }
.fv-play { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; }
.fv-play > span { position: relative; display: grid; place-items: center;
  width: clamp(54px, 4.7vw, 86px); aspect-ratio: 1; border-radius: 50%;
  background: var(--red); color: var(--paper);
  transition: transform .35s var(--ease), background .35s var(--ease); }
.fv-play > span::before { content: ''; position: absolute; inset: -2px; border-radius: 50%;
  border: 2px solid var(--red); animation: fv-pulse 2.6s var(--ease) infinite; }
@keyframes fv-pulse { 0% { transform: scale(1); opacity: .75 }
  70%, 100% { transform: scale(1.6); opacity: 0 } }
.fv-open:hover .fv-play > span { transform: scale(1.08); background: var(--red-lt); }
.fv-time { position: absolute; right: 10px; bottom: 10px; z-index: 1; line-height: 1;
  font-family: Oswald, sans-serif; font-size: var(--fs-cap); letter-spacing: .08em;
  color: var(--paper); background: rgba(14,12,16,.72); padding: 5px 9px; }

/* два столбца сравнения: слева как у всех, справа как у нас */
.fv-cmp { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px, 1.25vw, 24px);
  margin-top: clamp(20px, 2vw, 38px); }
.fv-col { background: var(--ink-lift); border: 1px solid #1F1D24;
  padding: clamp(16px, 1.5vw, 28px); }
.fv-col.on { border-color: var(--red); }
.fv-col b { display: block; font-family: Oswald, sans-serif; font-weight: 600;
  font-size: var(--fs-cap); letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted-hi); }
.fv-col.on b { color: var(--red-lt); }
.fv-col ul { list-style: none; margin: clamp(11px, 1vw, 18px) 0 0; padding: 0;
  display: grid; gap: clamp(7px, .63vw, 12px); }
.fv-col li { position: relative; padding-left: 16px; font-size: var(--fs-body);
  line-height: var(--lh-text); color: var(--muted-lo); }
.fv-col li::before { content: ''; position: absolute; left: 0; top: .68em;
  width: 7px; height: 1px; background: var(--muted-hi); }
.fv-col.on li::before { background: var(--red); }

/* ── 08. Цена ── */
.price { display: grid; grid-template-columns: minmax(0, 1fr) clamp(240px, 24.1vw, 462px);
  gap: clamp(20px, 2.4vw, 46px); margin-top: clamp(28px, 2.4vw, 46px); align-items: stretch; }
.price .box { background: var(--ink-lift); border: 1px solid #1F1D24;
    padding: clamp(20px, 1.67vw, 32px) clamp(22px, 2.5vw, 48px);
    display: grid; grid-template-columns: minmax(0, 1fr) clamp(230px, 27vw, 440px); gap: 0; }
  /* коллаж снимков внутри карточки цены — тот же приём, что в первом экране */
  .price .collage { position: relative; justify-self: start; margin-top: 10px;
    margin-left: 10px;
    width: clamp(210px, 27vw, 420px); min-height: clamp(300px, 29vw, 490px); }
  .price .collage .shot { position: absolute; }
  .price .collage .shot.a, .price .collage .shot.b {
    width: clamp(130px, 16vw, 270px); }
  .price .collage .shot.a { left: 0; top: 0; }
  .price .collage .shot.b { right: 0; bottom: 0; }
.price .tagline { font-size: var(--fs-cap); letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted-hi); font-family: Oswald, sans-serif; }
.price .sum { font-family: Oswald, sans-serif; font-weight: 700; font-size: clamp(40px, 3.44vw, 66px);
  line-height: 1; letter-spacing: -.01em; margin: 10px 0 clamp(16px, 1.04vw, 20px); }
.price ul { list-style: none; margin: 0; padding: 0; display: grid; gap: clamp(9px, .63vw, 12px); }
.price li { display: flex; gap: 12px; font-size: var(--fs-body); line-height: var(--lh-text);
  color: var(--muted-lo); }
.price li svg { flex: none; width: 18px; height: 18px; margin-top: 3px; color: var(--red); }
.price .box > div:first-child { display: flex; flex-direction: column; }
.price .box ul { margin-bottom: auto; }
.price .btn { margin-top: clamp(20px, 1.46vw, 28px); }
.price .extra { display: grid; gap: clamp(12px, .89vw, 17px); align-content: start; }
.price .extra .item { background: var(--ink-lift); border: 1px solid #1F1D24;
  padding: clamp(18px, 1.67vw, 32px); }
.price .extra b { display: block; font-family: Oswald, sans-serif; font-weight: 600;
  text-transform: uppercase; font-size: var(--fs-h3); line-height: var(--lh-head); }
.price .extra p { margin-top: 10px; font-size: var(--fs-body); line-height: var(--lh-text);
  color: var(--muted-lo); }

/* ── 08b. Экспресс-тест ── */
.qz-layout { display: grid; grid-template-columns: minmax(260px, .85fr) minmax(340px, 1.15fr);
  gap: clamp(28px, 3.75vw, 72px); align-items: start; }
.qz-side { padding-top: clamp(4px, .6vw, 12px); }
.qz { position: relative; overflow: hidden;
  background: var(--ink); border: 1px solid #1F1D24;
  padding: clamp(24px, 2.2vw, 44px); margin-top: clamp(28px, 2.4vw, 46px); }

/* строка прогресса: подпись слева, сегменты по центру, процент справа —
   вместо одной сплошной полосы, которая не показывала номер вопроса */
.qz-top { display: flex; align-items: center; gap: clamp(12px, 1.25vw, 24px);
  margin-bottom: clamp(20px, 1.9vw, 32px); }
.qz-top .qz-count { margin: 0; flex: none; }
.qz-dashes { display: flex; gap: 6px; flex: 1; }
.qz-dashes .dash { flex: 1; height: 4px; background: #232128; transition: background .3s var(--ease); }
.qz-dashes .dash.on { background: var(--red); }
.qz-pct { flex: none; font-family: Oswald, sans-serif; font-size: var(--fs-cap); color: var(--muted-hi); }

/* каждый шаг — свой key, поэтому вход анимируется заново при каждой смене экрана */
.qz-panel { animation: qz-in .4s var(--ease); }
.qz-panel.back { animation: qz-in-back .4s var(--ease); }
@keyframes qz-in { from { opacity: 0; transform: translateX(18px); }
  to { opacity: 1; transform: translateX(0); } }
@keyframes qz-in-back { from { opacity: 0; transform: translateX(-18px); }
  to { opacity: 1; transform: translateX(0); } }
.qz-count { display: block; font-family: Oswald, sans-serif; font-size: var(--fs-cap);
  letter-spacing: .14em; text-transform: uppercase; color: var(--red-lt);
  margin-bottom: clamp(10px, .94vw, 18px); }
.qz-intro { font-size: var(--fs-lead); line-height: var(--lh-text); color: var(--muted-lo);
  max-width: 52ch; margin-bottom: clamp(20px, 1.9vw, 32px); }
.qz-panel h3 { max-width: 40ch; }
.qz-help { margin-top: 6px; font-size: var(--fs-cap); color: var(--muted-hi); }

/* список без иконок — «да / иногда / нет» и подобные ответы */
.qz-opts { display: grid; gap: 10px; margin: clamp(18px, 1.6vw, 28px) 0 clamp(14px, 1.3vw, 22px); }
.qz-opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  font: inherit; font-size: var(--fs-body); color: var(--paper);
  background: #131117; border: 1px solid #2A2830; border-left: 3px solid #2A2830;
  padding: clamp(13px, 1.15vw, 18px) clamp(16px, 1.35vw, 22px); cursor: pointer;
  transition: border-color .25s var(--ease), background .25s var(--ease), transform .25s var(--ease); }
.qz-opt:hover { background: #1B1920; border-left-color: var(--red-lt); }
.qz-opt.on { border-left-color: var(--red); background: #1B1119; transform: translateX(2px); }
.qz-dot { flex: none; position: relative; width: 16px; height: 16px; border-radius: 50%;
  border: 1.5px solid var(--muted-hi);
  transition: border-color .25s var(--ease), background .25s var(--ease); }
.qz-opt.on .qz-dot { border-color: var(--red); background: var(--red); }
.qz-opt.on .qz-dot::after { content: ''; position: absolute; inset: 4px;
  border-radius: 50%; background: var(--paper); }

/* сетка с иконками — «чем занимаетесь / как покупают / что важнее» */
.qz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
  gap: 10px; margin: clamp(18px, 1.6vw, 28px) 0 clamp(14px, 1.3vw, 22px); }
.qz-card { position: relative; display: flex; flex-direction: column; align-items: flex-start;
  min-width: 0; gap: 10px; text-align: left; font: inherit; font-size: var(--fs-cap);
  color: var(--paper); background: #131117; border: 1px solid #2A2830;
  padding: clamp(14px, 1.25vw, 20px); cursor: pointer;
  transition: border-color .25s var(--ease), background .25s var(--ease), transform .25s var(--ease); }
.qz-card:hover { background: #1B1920; border-color: #3A3742; }
.qz-card.on { border-color: var(--red); background: #1B1119; transform: translateY(-2px); }
.qz-ico { display: grid; place-items: center; width: 30px; height: 30px; color: var(--muted-hi);
  transition: color .25s var(--ease); }
.qz-ico .lu { width: 22px; height: 22px; }
/* без break-word: браузер иначе режет слово на границе строки, даже когда
   оно целиком спокойно помещается на следующей — резалось «продажи» на
   «прод» + «ажи», хотя слово короче, чем уже влезавшее «Производство» */
.qz-label { display: block; width: 100%; min-width: 0; overflow-wrap: normal; }
.qz-card.on .qz-ico { color: var(--red-lt); }
.qz-badge { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--red); color: var(--paper); display: grid; place-items: center; }
.qz-badge svg { width: 11px; height: 11px; }

/* назад / далее */
.qz-nav { display: flex; align-items: center; gap: clamp(12px, 1.15vw, 20px);
  margin-top: clamp(6px, .6vw, 10px); }
.qz-nav .btn { flex: 1; justify-content: center; }
.qz-nav .btn[disabled] { opacity: .4; cursor: not-allowed; pointer-events: none; }

.qz-back { margin-top: 4px; background: none; border: 0; padding: 6px 0; font: inherit;
  font-size: var(--fs-cap); letter-spacing: .04em; color: var(--muted-hi); cursor: pointer; }
.qz-back:hover { color: var(--paper); }
.qz-recap { background: var(--ink-lift); border: 1px solid var(--red);
  padding: clamp(16px, 1.5vw, 26px);
  margin: clamp(18px, 1.6vw, 28px) 0 clamp(20px, 1.8vw, 30px); }
.qz-recap b { display: block; font-family: Oswald, sans-serif; font-size: var(--fs-cap);
  letter-spacing: .1em; text-transform: uppercase; color: var(--red-lt); margin-bottom: 8px; }
.qz-recap p { font-size: var(--fs-body); line-height: var(--lh-text); color: var(--muted-lo); }
.qz-cta-h { font-size: var(--fs-h4); line-height: var(--lh-head);
  margin-top: clamp(22px, 2vw, 34px); padding-top: clamp(18px, 1.6vw, 28px);
  border-top: 1px solid #232128; }
.qz-cta-p { margin-top: 8px; font-size: var(--fs-body); line-height: var(--lh-text);
  color: var(--muted-lo); max-width: 48ch; }
.qz-form { max-width: 420px; margin-top: clamp(16px, 1.5vw, 26px); }
.qz-form .btn { width: 100%; }

/* ── 09. Вопросы ── */
.faq { margin-top: clamp(28px, 2.4vw, 46px); border-top: 1px solid #1F1D24; }
.q { border-bottom: 1px solid #1F1D24; }
.q button {
  width: 100%; background: none; border: 0; color: inherit; cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: 20px; padding: clamp(18px, 1.46vw, 28px) 0;
  font-family: Oswald, sans-serif; font-weight: 500; text-transform: uppercase;
  font-size: var(--fs-h4); line-height: 1.25; transition: color .2s var(--ease);
}
.q button:hover { color: var(--red-lt); }
.q .mark { flex: none; margin-left: auto; width: 22px; height: 22px; position: relative; }
.q .mark::before, .q .mark::after {
  content: ''; position: absolute; inset: 50% 0 auto; height: 2px; background: var(--red);
  transition: transform .3s var(--ease);
}
.q .mark::after { transform: rotate(90deg); }
.q[data-open="1"] .mark::after { transform: rotate(0deg); }
.q .body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
.q[data-open="1"] .body { grid-template-rows: 1fr; }
.q .body > div { overflow: hidden; }
.q .body p { font-size: var(--fs-lead); line-height: var(--lh-text); color: var(--muted-lo);
  max-width: 92ch; padding-bottom: clamp(18px, 1.46vw, 28px); }

/* ── 10. Заявка ── */
.contact { display: grid; grid-template-columns: 1.15fr .85fr; gap: clamp(20px, 1.67vw, 32px);
  margin-top: clamp(28px, 2.4vw, 46px); align-items: start; }
.contact .box { background: var(--ink); padding: clamp(22px, 2.1vw, 40px); }

.form { display: grid; gap: 12px; margin-top: clamp(18px, 1.46vw, 28px); }
/* поле-ловушка для ботов: человеку не видно, бот заполняет — такие заявки сервер выкидывает */
form.form input.hp-field { position: absolute; left: 0; top: 0; width: 1px; min-width: 0; height: 0;
  padding: 0; margin: 0; border: 0; overflow: hidden; clip-path: inset(50%); opacity: 0; pointer-events: none; }
.form input {
  font: inherit; font-size: var(--fs-lead); color: var(--paper); background: #131117;
  border: 1px solid #2A2830; padding: 14px 16px; width: 100%;
  transition: border-color .2s var(--ease);
}
.form input::placeholder { color: var(--muted-hi); }
.form input:focus { border-color: var(--red); outline: none; }
.form .btn { margin-top: 6px; }
.form .note { font-size: var(--fs-cap); color: var(--muted-hi); line-height: 1.5; }
.contact .aside p { margin-top: 12px; font-size: var(--fs-body); line-height: var(--lh-text);
  color: var(--muted-lo); }
.contact .aside .btn { margin-top: clamp(18px, 1.46vw, 28px); }

/* ── подвал ── */
/* подвал держим сплошным чёрным: знаки на фоне здесь лишние */
.foot { border-top: 1px solid #1F1D24; background: var(--ink); }
.foot .shell { display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
  gap: clamp(28px, 5.2vw, 100px);
  padding-top: clamp(32px, 2.9vw, 56px); padding-bottom: clamp(24px, 2vw, 38px); }
.foot .brand { max-width: 34ch; }
.foot .logo { height: 38px; width: auto; transition: opacity .2s var(--ease); }
.foot .brand a:hover .logo { opacity: .8; }
.foot .tag { margin-top: 14px; font-size: var(--fs-body); color: var(--muted-hi); }
.foot h4 { font-family: Oswald, sans-serif; font-weight: 500; text-transform: uppercase;
  letter-spacing: .12em; font-size: var(--fs-cap); color: var(--muted-hi); margin: 0 0 14px; }
.foot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.foot a { color: var(--muted-lo); text-decoration: none; font-size: var(--fs-body);
  transition: color .2s var(--ease); }
.foot a:hover { color: var(--paper); }
.foot .rule { border-top: 1px solid #1F1D24; }
.foot .rule .shell { display: flex; flex-wrap: wrap; justify-content: space-between;
  gap: 12px clamp(20px, 3vw, 48px);
  padding-top: 20px; padding-bottom: 26px; font-size: var(--fs-cap); color: var(--muted-hi); }
.foot .rule .by { margin-left: auto; color: var(--muted-lo); }
.foot .rule .by:hover { color: var(--paper); }
.foot .rule a { text-decoration: none; }
@media (max-width: 760px) { .foot .rule .by { margin-left: 0; } }

/* ── иконка Lucide ── */
.lu { width: 26px; height: 26px; display: block; }
.who .ico { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
  background: rgba(232,36,60,.12); border: 1px solid rgba(232,36,60,.3); color: var(--red-lt);
  margin-bottom: clamp(14px, 1.15vw, 22px);
  transition: background .3s var(--ease), color .3s var(--ease), transform .3s var(--ease); }
.who:hover .ico { background: var(--red); color: #fff; transform: translateY(-2px); }

/* ── подсветка-пилюля переезжает от тега к тегу ── */
.panel .tags { position: relative; }
.panel .pill { position: absolute; left: 0; top: 0; border-radius: 999px; z-index: 0;
  background: var(--red); pointer-events: none;
  transition: transform .62s cubic-bezier(.34, 1.28, .44, 1),
              width .62s cubic-bezier(.34, 1.28, .44, 1), opacity .35s var(--ease); }
.panel .tag { position: relative; z-index: 1;
  transition: color .4s var(--ease), border-color .55s var(--ease); }
.panel .tag.hot { color: #fff; border-color: var(--red); }

/* ── шаги запуска: линия прогресса заполняется по мере прокрутки ── */
.steps { position: relative; padding-left: clamp(24px, 1.98vw, 38px); }
.steps::before { content: ''; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px;
  background: #201E26; }

.step .n { position: relative; color: #3A3742; transition: color .45s var(--ease); }
.step .n::before { content: ''; position: absolute; z-index: 1;

/* ─────────── страница из блоков: тексты, порядок, картинки ─────────── */
/* Всё, что меняют в админке, лежит в одном JSON на сервере: порядок блоков,
   изменённые тексты, ссылки и картинки. Пока там пусто, компоненты показывают
   тексты прямо из вёрстки — поэтому без правок сайт выглядит ровно как раньше. */
const IS_ADMIN = false;
const CONTENT_URL = 'https://glebslobodchikov.ru/appforse-leads/content.json';

const BlockCtx = React.createContext({ id: '', data: {} });
/* в админке — методы редактора, на сайте всегда null */
const EditCtx = React.createContext(null);

const getPath = (obj, path) => {
  let v = obj;
  const parts = String(path).split('.');
  for (let i = 0; i < parts.length; i++) {
    if (v == null) return undefined;
    v = v[parts[i]];
  }
  return v;
};

/* перенос строки из админки превращается в тот же {' '}<br />, что в вёрстке:
   на мобилке переносы в заголовках скрыты, и слова не должны слипаться */
const renderText = s => {
  const lines = String(s).split('\n');
  if (lines.length === 1) return lines[0];
  return lines.map((l, i) => (
    <React.Fragment key={i}>{i ? ' ' : null}{i ? <br /> : null}{l}</React.Fragment>
  ));
};

/* «отпечаток» детей: текст и теги без функций — чтобы не перерисовывать
   текст, который сейчас правят, когда родитель обновился по своим делам */
const sig = c => {
  if (c == null || c === false || c === true) return '';
  if (typeof c === 'string' || typeof c === 'number') return String(c);
  if (Array.isArray(c)) return c.map(sig).join('');
  if (c.props) return '<' + (typeof c.type === 'string' ? c.type : 'c') + '>' + sig(c.props.children);
  return '';
};

/* Текст с ключом. На сайте — просто текст (или правка из админки вместо него),
   в админке — поле, которое правится по клику. */
const T = React.memo(function T({ k, link, children }) {
  const blk = React.useContext(BlockCtx);
  const ed = React.useContext(EditCtx);
  const v = getPath(blk.data, k);
  const shown = typeof v === 'string' ? renderText(v) : children;
  if (!ed || !ed.editing) return shown;
  return (
    <EditText key={typeof v === 'string' ? 'v:' + v : 'd'} blk={blk.id} k={k} link={link} ed={ed}>
      {shown}
    </EditText>
  );
}, (a, b) => a.k === b.k && a.link === b.link && sig(a.children) === sig(b.children));

/* кнопка-ссылка: текст и адрес меняются в админке */
const A = ({ k, href, icon, children, ...rest }) => {
  const blk = React.useContext(BlockCtx);
  const h = getPath(blk.data, k + 'Href');
  return (
    <a href={typeof h === 'string' && h ? h : href} {...rest}>
      {icon}<T k={k} link={k + 'Href'}>{children}</T>
    </a>
  );
};

const useBlockId = () => React.useContext(BlockCtx).id;

/* список карточек/пунктов: пока его не трогали в админке — берём из вёрстки */
const useList = (key, defaults) => {
  const blk = React.useContext(BlockCtx);
  const ed = React.useContext(EditCtx);
  if (ed) ed.lists[blk.id + '/' + key] = defaults;
  const v = blk.data[key];
  return Array.isArray(v) ? v : defaults;
};

/* Теги: подсветка-пилюля переезжает от тега к тегу.
   Приём из «Animated Tabs» (buildui.com) и Smooth Tabs (motion.dev): в Motion это
   общий layoutId, здесь то же самое без библиотеки — один элемент, который
   переставляется под активный тег, а переезд делает CSS-переход. */
const Tags = ({ items: defItems, k }) => {
  const items = useList(k, defItems);
  const [hot, setHot] = useState(0);
  const wrap = useRef(null);
  const [box, setBox] = useState({ x: 0, y: 0, w: 0, h: 0, ready: false });

  useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const t = setInterval(() => setHot(v => (v + 1) % items.length), 2000);
    return () => clearInterval(t);
  }, [items.length]);

  useEffect(() => {
    const move = () => {
      const el = wrap.current && wrap.current.querySelectorAll('.tag')[hot];
      if (!el) return;
      setBox({ x: el.offsetLeft, y: el.offsetTop,
               w: el.offsetWidth, h: el.offsetHeight, ready: true });
    };
    move();
    window.addEventListener('resize', move);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(move);
    return () => window.removeEventListener('resize', move);
  }, [hot, items.length]);

  return (
    <div className="tags" ref={wrap}>
      <span className="pill" aria-hidden="true" style={{
        transform: 'translate(' + box.x + 'px,' + box.y + 'px)',
        width: box.w, height: box.h, opacity: box.ready ? 1 : 0,
      }} />
      {items.map((t, i) => (
        <span className={'tag' + (i === hot ? ' hot' : '')} key={i}><T k={k + '.' + i}>{t}</T></span>
      ))}
    </div>
  );
};

/* Появление при прокрутке.
   Класс держим в состоянии React: если добавлять его напрямую в DOM,
   любая следующая перерисовка родителя затрёт его вместе с className. */
function Rise({ as: Tag = 'div', delay = 0, now = false, className = '', style, children, ...rest }) {
  const ref = useRef(null);
  // now — блоки первого экрана: видны сразу, без ожидания наблюдателя прокрутки,
  // иначе кнопки и факты «доезжают» почти секунду после загрузки
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    // now — первый экран: та же анимация выезда, но стартует сразу, одной
    // волной; не ждём наблюдателя прокрутки и не копим transitionDelay
    if (now) {
      const r = requestAnimationFrame(() => setSeen(true));
      return () => cancelAnimationFrame(r);
    }
    const el = ref.current;
    if (!el) return;
    if (!('IntersectionObserver' in window)) { setSeen(true); return; }
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setSeen(true); io.disconnect(); }
    }, { rootMargin: '0px 0px -12% 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  const cls = 'rise' + (seen ? ' seen' : '') + (className ? ' ' + className : '');
  return (
    <Tag ref={ref} className={cls}
         style={Object.assign({ transitionDelay: delay + 'ms' }, style)} {...rest}>
      {children}
    </Tag>
  );
}

/* Заявка уходит на сервер-посредник на Beget: он пересылает её в Телеграм-бота
   «Заявки AppForse» и на почту заказчика. Токен бота в код страницы не кладём —
   он живёт только на сервере. text/plain — чтобы браузер не делал лишний
   предварительный запрос перед отправкой. */
const LEAD_URL = 'https://glebslobodchikov.ru/appforse-leads/lead.php';

function useForm(rules, source, extra) {
  const [err, setErr] = useState({});
  const [sent, setSent] = useState(false);
  const [sending, setSending] = useState(false);
  const [failed, setFailed] = useState(false);
  const submit = e => {
    e.preventDefault();
    if (sending || sent) return;
    const f = e.target;
    const next = {};
    rules.forEach(([name, check, msg]) => {
      const el = f.elements[name];
      if (!check(el)) next[name] = msg;
    });
    setErr(next);
    if (Object.keys(next).length) return;
    // в админке форма только показывает, как выглядит отправка
    if (IS_ADMIN) { setSent(true); return; }
    const trap = f.elements.namedItem('website');
    const payload = Object.assign({
      name: f.elements.namedItem('name').value.trim(),
      phone: f.elements.namedItem('phone').value.trim(),
      source: source,
      hp: trap ? trap.value : '',
    }, extra ? extra() : {});
    setSending(true);
    setFailed(false);
    fetch(LEAD_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify(payload),
    })
      .then(r => r.json())
      .then(j => { if (!j || !j.ok) throw new Error('not delivered'); setSent(true); })
      .catch(() => setFailed(true))
      .then(() => setSending(false));
  };
  const clear = name => setErr(prev => {
    if (!prev[name]) return prev;
    const next = { ...prev }; delete next[name]; return next;
  });
  return { err, sent, sending, failed, submit, clear };
}

/* Поле телефона: «+7» стоит в поле с самого начала и не стирается —
   так же, как в форме заявки на других наших сайтах. Клиент начинал
   набор с восьмёрки и путался, поэтому код страны задан жёстко. */
const digitsOf = v => {
  // «+7» — часть маски, а не номер: отбрасываем его текстом, иначе
  // семёрка префикса попадёт в подсчёт и номер съедет на цифру
  let d = String(v).replace(/^\+7\s*/, '').replace(/[^0-9]/g, '');
  if (d.length === 11 && (d[0] === '7' || d[0] === '8')) d = d.slice(1);
  return d.slice(0, 10);
};

const fmtPhone = d => {
  if (!d) return '+7 ';                     // цифр нет — в поле остаётся только префикс
  let out = '+7 (' + d.slice(0, 3);
  if (d.length >= 3) out += ') ' + d.slice(3, 6);
  if (d.length >= 6) out += '-' + d.slice(6, 8);
  if (d.length >= 8) out += '-' + d.slice(8, 10);
  return out;
};

const PHONE_MASK = '+7 (000) 000-00-00';

const PhoneField = ({ err, onFix }) => {
  const [val, setVal] = useState('+7 ');
  const change = e => {
    const raw = e.target.value;
    let d = digitsOf(raw);
    // стёрли разделитель: цифр столько же, а строка короче — значит
    // человек метил в цифру перед ним, иначе удаление упирается в тупик
    if (raw.length < val.length && digitsOf(val).length === d.length) d = d.slice(0, -1);
    setVal(fmtPhone(d));
    onFix();
  };
  // Backspace/Delete на пустом номере упёрся бы в «+7» — не даём его стереть
  const keyDown = e => {
    if ((e.key === 'Backspace' || e.key === 'Delete') && !digitsOf(e.target.value)) {
      e.preventDefault();
      if (val !== '+7 ') setVal('+7 ');
    }
  };
  // незаполненный хвост маски виден серым, поверх него человек печатает свой номер
  const shown = val || '+7 ';
  const tail = PHONE_MASK.slice(shown.length);
  return (
    <div className="field">
      <div className="phone">
        <span className="ghost" aria-hidden="true"><i>{shown}</i>{tail}</span>
        <input name="phone" type="tel" inputMode="tel" autoComplete="tel" aria-label="Телефон"
               className={err ? 'bad' : ''} value={val} onChange={change}
               onKeyDown={keyDown} onInvalid={e => e.preventDefault()}
               onBlur={() => { if (!val) setVal('+7 '); }} />
      </div>
      {err && <span className="err">{err}</span>}
    </div>
  );
};

/* Знаки и лучи на канвасе за всей страницей.
   Взято с эффекта Particle Drift, но переписано под наш стек: оригинал поднимал
   iframe с Tailwind, GSAP и Iconify (около двух мегабайт сторонних скриптов) —
   здесь только канвас, синий заменён фирменным красным.
   Анимация замирает на скрытой вкладке и не стартует при отключённой
   анимации в системе. */
const GLYPHS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*()'.split('');

const ParticleField = () => {
  const ref = useRef(null);
  const [on, setOn] = useState(false);

  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    const slow = window.matchMedia
      && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (slow) return;
    const ctx = cv.getContext && cv.getContext('2d');
    if (!ctx) return;

    let w = 0, h = 0, nodes = [], beams = [], raf = 0;
    const mouse = { x: -1e4, y: -1e4 };
    const fine = window.matchMedia && window.matchMedia('(pointer: fine)').matches;

    const measure = () => {
      const r = cv.getBoundingClientRect();
      w = r.width; h = r.height;
      /* на экранах с плотностью 3 полный буфер даёт девятикратную заливку —
         держим потолок, разницы на глаз нет */
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    const seed = () => {
      /* связи ищем перебором пар, поэтому число знаков держим скромным:
         80 точек это около 3200 сравнений за кадр, 42 — примерно 860.
         Лучей держим минимум: они самые заметные, а фон не должен
         перетягивать внимание на себя */
      const nCount = w < 760 ? 42 : 80;
      const bCount = w < 760 ? 4 : 7;
      nodes = [];
      for (let i = 0; i < nCount; i++) {
        nodes.push({
          x: Math.random() * w, y: Math.random() * h,
          vy: Math.random() * 0.1 + 0.03,
          ch: GLYPHS[(Math.random() * GLYPHS.length) | 0],
        });
      }
      beams = [];
      for (let i = 0; i < bCount; i++) {
        beams.push({
          x: Math.random() * w, y: Math.random() * h,
          len: Math.random() * 90 + 46,
          sp: Math.random() * 0.38 + 0.22,
          a: Math.random() * 0.2 + 0.14,
        });
      }
    };

    const LINK = 118;   // на каком расстоянии знаки соединяются
    const REACH = 170;  // на каком расстоянии тянутся к курсору

    const draw = () => {
      ctx.clearRect(0, 0, w, h);

      for (let i = 0; i < beams.length; i++) {
        const b = beams[i];
        b.y -= b.sp;
        if (b.y + b.len < 0) { b.y = h + 80; b.x = Math.random() * w; }
        const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.len);
        g.addColorStop(0, 'rgba(168, 30, 46, ' + b.a + ')');
        g.addColorStop(1, 'rgba(168, 30, 46, 0)');
        ctx.strokeStyle = g;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x, b.y + b.len);
        ctx.stroke();
      }

      ctx.lineWidth = 0.5;
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < LINK) {
            ctx.strokeStyle = 'rgba(96, 96, 110, ' + (0.105 * (1 - d / LINK)) + ')';
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      ctx.font = '12px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        n.y += n.vy;
        if (n.y > h + 18) { n.y = -18; n.x = Math.random() * w; }
        const dx = mouse.x - n.x, dy = mouse.y - n.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        const near = d < REACH;
        if (near || Math.random() > 0.997) {
          n.ch = GLYPHS[(Math.random() * GLYPHS.length) | 0];
        }
        if (near) {
          ctx.strokeStyle = 'rgba(198, 34, 54, ' + (0.22 * (1 - d / REACH)) + ')';
          ctx.beginPath();
          ctx.moveTo(n.x, n.y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.stroke();
        }
        ctx.fillStyle = near ? 'rgba(198, 52, 72, .55)' : 'rgba(96, 96, 110, 0.24)';
        ctx.fillText(n.ch, n.x, n.y);
      }

      raf = requestAnimationFrame(draw);
    };

    const start = () => { if (!raf) raf = requestAnimationFrame(draw); };
    const stop = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } };

    measure();
    seed();
    /* фон рисуем, когда браузер освободится: он не должен соревноваться
       с первым экраном за процессор на телефоне */
    const idle = window.requestIdleCallback
      ? window.requestIdleCallback(() => { start(); setOn(true); }, { timeout: 1500 })
      : window.setTimeout(() => { start(); setOn(true); }, 600);

    let resizeTimer = 0;
    const onResize = () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => { measure(); seed(); }, 150);
    };
    const onMove = e => {
      const r = cv.getBoundingClientRect();
      mouse.x = e.clientX - r.left;
      mouse.y = e.clientY - r.top;
    };
    const onLeave = () => { mouse.x = -1e4; mouse.y = -1e4; };

    window.addEventListener('resize', onResize);
    if (fine) {
      window.addEventListener('mousemove', onMove, { passive: true });
      window.addEventListener('mouseout', onLeave, { passive: true });
    }

    /* канвас теперь виден на всей странице, поэтому цикл гасим только
       на скрытой вкладке */
    const onHide = () => { if (document.hidden) stop(); else start(); };
    document.addEventListener('visibilitychange', onHide);

    return () => {
      if (window.cancelIdleCallback && window.requestIdleCallback) window.cancelIdleCallback(idle);
      else window.clearTimeout(idle);
      stop();
      window.clearTimeout(resizeTimer);
      window.removeEventListener('resize', onResize);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseout', onLeave);
      document.removeEventListener('visibilitychange', onHide);
    };
  }, []);

  return <canvas className={'pf' + (on ? ' on' : '')} ref={ref} aria-hidden="true" />;
};

  const [active, setActive] = useState(-1);
  useEffect(() => {
    const items = Array.prototype.slice.call(wrap.current.querySelectorAll('.step'));
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const i = items.indexOf(e.target);
        setActive(prev => (i > prev ? i : prev));
      });
    }, { rootMargin: '-45% 0px -40% 0px' });
    items.forEach(el => io.observe(el));
    return () => io.disconnect();

const Quiz = () => {
  const Q = useList('q', QUIZ_Q);
  const NOTES = useList('notes', QUIZ_NOTE);
  const total = Q.length;
  const [step, setStep] = useState(1);        // 1..total — вопросы (без интро), total+1 — результат
  const [dir, setDir] = useState(1);
  const [answers, setAnswers] = useState({});
  const [picked, setPicked] = useState(-1);

  useEffect(() => {
    if (step >= 1 && step <= total) {
      const saved = answers[step];
      setPicked(saved ? Q[step - 1].a.indexOf(saved) : -1);
    }
  }, [step]);

  /* карточка с вариантами выше следующей — без этого при переходе вопрос
     обрывался внизу экрана, а докрутить самому не всегда очевидно.
     Подводим верх карточки под шапку на каждом шаге, кроме самого первого
     рендера — иначе страница дёргалась бы к квизу сразу при загрузке. */
  const mounted = useRef(false);
  useEffect(() => {
    if (!mounted.current) { mounted.current = true; return; }
    const el = document.getElementById('qz-box');
    if (!el) return;
    const raf = requestAnimationFrame(() => {
      const header = document.querySelector('.top');
      const off = (header ? header.offsetHeight : 0) + 16;
      const y = el.getBoundingClientRect().top + window.pageYOffset - off;
      const reduce = window.matchMedia
        && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (Math.abs(window.pageYOffset - y) > 24) {
        window.scrollTo({ top: y < 0 ? 0 : y, behavior: reduce ? 'auto' : 'smooth' });
      }
    });
    return () => cancelAnimationFrame(raf);
  }, [step]);

  /* выбор варианта только подсвечивает карточку — переход делает «Далее»,
     раньше клик сам вёл на следующий шаг через паузу */
  const choose = i => setPicked(i);
  const next = () => {
    if (picked === -1) return;
    setAnswers(prev => Object.assign({}, prev, { [step]: Q[step - 1].a[picked] }));
    setDir(1);
    setStep(s => s + 1);
  };
  const back = () => { setDir(-1); setStep(s => Math.max(1, s - 1)); };
  const restart = () => { setAnswers({}); setPicked(-1); setDir(1); setStep(1); };

  // текущий вопрос считается пройденным сегментом (вопрос 1 из 5 = 20%,
  // а не 0% — иначе на первом же шаге полоса выглядит пустой)
  const filledCount = Math.min(step, total);
  const pct = Math.round((filledCount / total) * 100);
  const lastAns = answers[total];
  const noteIdx = lastAns ? Math.max(0, Q[total - 1].a.indexOf(lastAns)) : 0;

  return (
    <section className="dark" id="quiz">
      <div className="shell">
        <div className="qz-layout">
          <div className="qz-side">
            <Rise as="span" className="kicker"><T k="kicker">Экспресс-проверка</T></Rise>
            <Rise as="h2" delay={40}><T k="title">Подходит ли вашему бизнесу{' '}<br />собственное приложение?</T></Rise>
            <Rise as="p" className="lead" delay={90}>
              <T k="lead">Ответьте на 5 вопросов — покажем, какие функции AppForse можно использовать именно в вашем бизнесе.</T>
            </Rise>
          </div>

          <Rise className="qz" delay={140} id="qz-box">
            <div className="qz-top">
              <span className="qz-count">
                {step <= total ? ('Вопрос ' + step + ' из ' + total) : 'Готово'}
              </span>
              <div className="qz-dashes">
                {Q.map((_, i) => (
                  <span key={i} className={'dash' + (i < filledCount ? ' on' : '')} />
                ))}
              </div>
              <span className="qz-pct">{pct}%</span>
            </div>

            {step >= 1 && step <= total && (
              <div className={'qz-panel' + (dir < 0 ? ' back' : '')} key={'q' + step}>
                <h3><T k={'q.' + (step - 1) + '.t'}>{Q[step - 1].t}</T></h3>
                {Q[step - 1].h && <p className="qz-help"><T k={'q.' + (step - 1) + '.h'}>{Q[step - 1].h}</T></p>}

                {Q[step - 1].ic ? (
                  <div className="qz-grid">
                    {Q[step - 1].a.map((label, i) => (
                      <button type="button" key={label}
                              className={'qz-card' + (picked === i ? ' on' : '')}
                              onClick={() => choose(i)}>
                        <span className="qz-ico"><Ico name={Q[step - 1].ic[i]} /></span>
                        <span className="qz-label"><T k={'q.' + (step - 1) + '.a.' + i}>{label}</T></span>
                        {picked === i && <span className="qz-badge"><Check /></span>}
                      </button>
                    ))}
                  </div>
                ) : (
                  <div className="qz-opts">
                    {Q[step - 1].a.map((label, i) => (
                      <button type="button" key={label}
                              className={'qz-opt' + (picked === i ? ' on' : '')}
                              onClick={() => choose(i)}>
                        <span className="qz-dot" /><T k={'q.' + (step - 1) + '.a.' + i}>{label}</T>
                      </button>
                    ))}
                  </div>
                )}

                <div className="qz-nav">
                  {step > 1 && <button type="button" className="btn ghost" onClick={back}>← Назад</button>}
                  <button type="button" className="btn" disabled={picked === -1} onClick={next}>
                    {step === total ? 'Показать результат →' : 'Далее →'}
                  </button>
                </div>
              </div>
            )}

            {step === total + 1 && (
              <div className={'qz-panel qz-result' + (dir < 0 ? ' back' : '')} key="result">
                <div className="qz-recap">
                  <b>{lastAns || 'Ваш приоритет'}</b>
                  <p><T k={'notes.' + noteIdx}>{NOTES[noteIdx]}</T></p>
                </div>
                <h4 className="qz-cta-h display"><T k="ctaTitle">Готовы показать, как это будет работать у вас</T></h4>
                <p className="qz-cta-p">
                  <T k="ctaText">Оставьте контакты — уточним задачи вашего бизнеса и покажем, какие
                  возможности AppForse можно использовать для повторных продаж и работы
                  с клиентами.</T>
                </p>
                <QuizForm answers={answers} questions={Q} />
                <button type="button" className="qz-back" onClick={restart}><T k="restart">Пройти ещё раз</T></button>
              </div>
            )}
          </Rise>
        </div>
      </div>
    </section>
  );
};

const XReviews = () => {
  const items = useList('items', X_REVIEWS);
  const track = useRef(null);
  const [view, setView] = useState({ first: 0, per: 1, start: true, end: false });

  const stepOf = el => {
    const card = el.querySelector('.x-rev');
    const gap = parseFloat(getComputedStyle(el).columnGap) || 0;
    return card ? card.getBoundingClientRect().width + gap : el.clientWidth;
  };
  useEffect(() => {
    const el = track.current;
    if (!el) return undefined;
    const measure = () => {
      const step = stepOf(el);
      setView({
        first: Math.max(0, Math.min(items.length - 1, Math.round(el.scrollLeft / step))),
        per: Math.max(1, Math.round(el.clientWidth / step)),
        start: el.scrollLeft < 4,
        end: el.scrollLeft + el.clientWidth >= el.scrollWidth - 4,
      });
    };
    measure();
    el.addEventListener('scroll', measure, { passive: true });
    window.addEventListener('resize', measure);
    return () => { el.removeEventListener('scroll', measure); window.removeEventListener('resize', measure); };
  }, [items.length]);

  /* добавили отзыв в админке — ленту докручиваем до него */
  const count = useRef(items.length);
  useEffect(() => {
    if (items.length > count.current && track.current) {
      track.current.scrollTo({ left: track.current.scrollWidth, behavior: 'smooth' });
    }
    count.current = items.length;
  }, [items.length]);

  const reduce = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const go = dir => {
    const el = track.current;
    if (el) el.scrollBy({ left: dir * stepOf(el), behavior: reduce() ? 'auto' : 'smooth' });
  };
  const to = i => {
    const el = track.current;
    if (el) el.scrollTo({ left: i * stepOf(el), behavior: reduce() ? 'auto' : 'smooth' });
  };

  return (
    <section className="dark x-block" id={useBlockId()}>
      <div className="shell">
        <div className="x-rev-head">
          <div>
            <Rise as="span" className="kicker"><T k="kicker">Отзывы клиентов</T></Rise>

          </div>
          <Rise className="x-rev-nav" delay={80}>
            <button type="button" aria-label="Предыдущий отзыв" disabled={view.start} onClick={() => go(-1)}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"
                   strokeLinejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
            </button>
            <button type="button" aria-label="Следующий отзыв" disabled={view.end} onClick={() => go(1)}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"
                   strokeLinejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
          </Rise>
        </div>
        <Rise className="x-rev-wrap" delay={120}>
          <div className="x-rev-track" ref={track}>
            {items.map((r, i) => (
              <article className="x-rev" key={i}>
                <Item list="items" i={i} />
                <svg className="x-rev-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z" /><path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z" /></svg>
                <p><T k={'items.' + i + '.text'}>{r.text}</T></p>
                <div className="x-rev-by">
                  <span className="x-rev-ava" aria-hidden="true">{initials(r.name) || '•'}</span>
                  <div className="x-rev-who">
                    <b><T k={'items.' + i + '.name'}>{r.name}</T></b>
                    <span className="x-rev-role"><T k={'items.' + i + '.role'}>{r.role}</T></span>
                  </div>
                </div>
              </article>
            ))}
            <AddItem list="items" label="Отзыв"
                     make={() => ({ text: 'Текст нового отзыва', name: 'Имя Фамилия', role: 'Должность, компания' })} />
          </div>
          {items.length > view.per && (
            <div className="x-rev-dots" role="tablist" aria-label="Отзывы">
              {items.map((_, i) => (
                <button type="button" key={i} aria-label={'Отзыв ' + (i + 1)}
                        className={i >= view.first && i < view.first + view.per ? 'on' : ''}
                        onClick={() => to(i)} />
              ))}
            </div>
          )}
        </Rise>
      </div>
    </section>
  );
};

const DEFAULT_ORDER = [

  ['quiz', 'quiz'], ['how', 'how'], ['case', 'case'], ['price', 'price'], ['faq', 'faq'],
  ['contact', 'contact'],
];
const defaultPage = () => ({
  v: 1, chrome: {}, blocks: DEFAULT_ORDER.map(([id, type]) => ({ id, type, data: {} })),
});

const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
/* из сервера может прийти что угодно — берём только известные блоки */
const cleanPage = p => {
  if (!isObj(p) || !Array.isArray(p.blocks)) return null;
  return {
    v: 1,
    chrome: isObj(p.chrome) ? p.chrome : {},
    blocks: p.blocks
      .filter(b => isObj(b) && BLOCKS[b.type] && typeof b.id === 'string' && b.id)
      .map(b => ({ id: b.id, type: b.type, hidden: !!b.hidden, data: isObj(b.data) ? b.data : {} })),
  };
};

const Page = ({ page }) => {
  const chrome = React.useMemo(() => ({ id: 'chrome', data: page.chrome }), [page.chrome]);
  return (
    <React.Fragment>
      <BlockCtx.Provider value={chrome}><Top /></BlockCtx.Provider>
      <main>
        {page.blocks.filter(b => !b.hidden).map(b => {
          const B = BLOCKS[b.type].C;
          return <BlockCtx.Provider key={b.id} value={b}><B /></BlockCtx.Provider>;
        })}
      </main>
      <BlockCtx.Provider value={chrome}><Foot /></BlockCtx.Provider>
    </React.Fragment>
  );
};

let loadedPage = null;
const App = ({ initial }) => {
  const [page, setPage] = useState(initial);
  useEffect(() => {
    window.__setPage = p => { const c = cleanPage(p); if (c) setPage(c); };
    if (loadedPage && loadedPage !== initial) setPage(loadedPage);
    /* мобильный предпросмотр в админке показывает черновик, ещё не сохранённый */
    const onMsg = e => {
      if (e.origin === location.origin && e.data && e.data.type === 'appforse-draft') window.__setPage(e.data.page);
    };
    window.addEventListener('message', onMsg);
    if (window.parent !== window) window.parent.postMessage({ type: 'appforse-ready' }, location.origin);
    return () => window.removeEventListener('message', onMsg);
  }, []);
  return (
    <React.Fragment>
      <ParticleField />
      <Page page={page} />
    </React.Fragment>
  );
};

};

const setPath = (obj, path, value) => {
  const parts = String(path).split('.');
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (o[parts[i]] == null || typeof o[parts[i]] !== 'object') o[parts[i]] = /^\d+$/.test(parts[i + 1]) ? [] : {};
    o = o[parts[i]];
  }
  o[parts[parts.length - 1]] = value;
};

/* Типограф для правок: тот же набор правил, что у typo.py в вёрстке.
   Предлог не остаётся в конце строки, тире не начинает строку,
   число не отрывается от единицы. */
const NB = ' ';
const SHORT_WORDS = new Set(('в во на но и а с со к ко о об обо от ото до за из изо по при для без над под ' +
  'про у не ни что как же бы ли то их его её или да чем уже там где чтобы если ' +
  'все всё это так тех кто ещё был была было были есть').split(' '));
const typoLine = t => {
  t = t.replace(/(?<![\wЀ-ӿ])([\wЀ-ӿ]{1,6}) /g,
    (m, w) => (SHORT_WORDS.has(w.toLowerCase()) ? w + NB : m));
  t = t.replace(/ —/g, NB + '—');
  const parts = t.split(' ');
  if (parts.length > 1 && parts[parts.length - 1] && parts[parts.length - 2].indexOf(NB) < 0) {
    const last = parts.pop();
    parts[parts.length - 1] += NB + last;
    t = parts.join(' ');
  }
  t = t.replace(/(\d) (?=[\dЀ-ӿ₽])/g, '$1' + NB);
  return t.replace(/App Store/g, 'App' + NB + 'Store').replace(/Google Play/g, 'Google' + NB + 'Play');
};
const typo = s => String(s).split('\n').map(typoLine).join('\n');

/* текст из поля: <br> и новые строки браузера — в \n, пробелы схлопываем,
   неразрывные пробелы не трогаем */
const readText = el => {
  let out = '';
  const walk = node => {
    node.childNodes.forEach(c => {
      if (c.nodeType === 3) out += c.nodeValue;
      else if (c.nodeName === 'BR') out += '\n';
      else if (c.nodeType === 1 && !c.hasAttribute('data-adm-ui')) {
        if ((c.nodeName === 'DIV' || c.nodeName === 'P') && out && out[out.length - 1] !== '\n') out += '\n';
        walk(c);
      }
    });
  };
  walk(el);
  return out.replace(/[ \t\r]*\n[ \t\r]*/g, '\n').replace(/\n{2,}/g, '\n')
    .replace(/[ \t\r]+/g, ' ').replace(/^[ \n]+|[ \n]+$/g, '');
};

/* Детей запоминаем при появлении поля: пока человек печатает, React не должен
   сверять и переписывать текст внутри. Когда правка сохранилась, у поля
   меняется key — и оно рисуется заново уже с новым текстом. */
const EditText = ({ blk, k, link, ed, children }) => {
  const ref = useRef(null);
  const frozen = useRef(children);
  const start = useRef(null);
  const [pop, setPop] = useState(false);
  useEffect(() => {
    // внутри <button> браузеры плохо правят текст на месте — такие правим в плашке
    if (ref.current && ref.current.parentElement && ref.current.parentElement.closest('button')) setPop(true);
  }, []);

  if (pop) {
    return (
      <span ref={ref} className="adm-t adm-t-pop" title="Нажмите, чтобы изменить текст"
            onClick={e => {
              e.preventDefault(); e.stopPropagation();
              ed.openBar({ kind: 'text', blk, k, el: ref.current, value: readText(ref.current) });
            }}>
        {frozen.current}
      </span>
    );
  }
  return (
    <span ref={ref} className="adm-t" contentEditable suppressContentEditableWarning spellCheck={false}
          onFocus={e => { start.current = readText(e.currentTarget); }}
          onInput={() => ed.touch()}
          onClick={e => {
            e.stopPropagation();
            if (link) ed.openBar({ kind: 'link', blk, k: link, el: ref.current });
          }}
          onKeyDown={e => {
            if (e.key === 'Escape') { e.preventDefault(); e.currentTarget.blur(); }
            if (e.key === 'Enter') {
              e.preventDefault();
              if (!link) document.execCommand('insertLineBreak');
            }
          }}
          onPaste={e => {
            e.preventDefault();
            const t = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
            document.execCommand('insertText', false, t.replace(/\r/g, ''));
          }}
          onBlur={e => {
            const now = readText(e.currentTarget);
            if (now === start.current) { ed.touch(false); return; }
            if (!now) { ed.say('Пустой текст не сохраняем — верните хотя бы слово или скройте блок', 'error'); ed.touch(false); return; }
            ed.setText(blk, k, typo(now));
          }}>
      {frozen.current}
    </span>
  );
};

/* ── плашка под полем: ссылка кнопки или текст кнопки-<button> ─────────── */
const FloatBar = ({ bar, value, onCommit, onClose }) => {
  const [val, setVal] = useState(value || '');
  const box = useRef(null);
  const inp = useRef(null);
  useEffect(() => {
    if (bar.kind === 'text' && inp.current) { inp.current.focus(); inp.current.select(); }
    const down = e => {
      const own = (bar.anchor && bar.anchor.contains(e.target)) || (bar.el && bar.el.contains(e.target));
      if (box.current && !box.current.contains(e.target) && !own) onClose();
    };
    const key = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('mousedown', down);
    document.addEventListener('keydown', key);
    return () => { document.removeEventListener('mousedown', down); document.removeEventListener('keydown', key); };
  }, []);
  const style = { top: bar.top, left: bar.left };
  const isLink = bar.kind === 'link';
  return (
    <div ref={box} className="adm-float" style={style}>
      <span className="adm-float-ico"><AI n={isLink ? 'link' : 'pencil'} /></span>
      <label className="adm-float-label">{isLink ? 'Куда ведёт кнопка' : 'Текст кнопки'}</label>
      <input ref={inp} className="adm-input" value={val}
             placeholder={isLink ? '#contact, https://… или tel:+7…' : 'Текст кнопки'}
             onChange={e => setVal(e.target.value)} onBlur={() => onCommit(val)}
             onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); onCommit(val); onClose(); } }} />
      {isLink && <span className="adm-float-hint">#contact — к форме заявки, #price — к цене</span>}
    </div>
  );
};

const Layers = ({ page, onMove, onJump, onHide, onClose }) => {
  const [from, setFrom] = useState(null);
  const [over, setOver] = useState(null);
  const fromRef = useRef(null);
  const last = page.blocks.length - 1;
  const end = () => { fromRef.current = null; setFrom(null); setOver(null); };
  return (
    <aside className="adm-drawer" data-own-scroll>
      <div className="adm-drawer-head">
        <b>Структура страницы</b>
        <button type="button" className="adm-icon-btn" title="Закрыть" onClick={onClose}><AI n="x" /></button>
      </div>
      <p className="adm-hint">Перетащите блок в списке, чтобы поменять порядок. Клик по названию — перейти к блоку.</p>
      <ol className="adm-layers">
        {page.blocks.map((b, i) => (
          <li key={b.id} draggable
              className={(over === i ? 'over-before ' : '') + (over === i + 1 && i === last ? 'over-after ' : '')
                + (b.hidden ? 'is-hidden ' : '') + (from === i ? 'is-drag' : '')}
              onDragStart={e => { e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', b.id); } catch (err) { /* IE */ } fromRef.current = i; setFrom(i); }}
              onDragOver={e => {
                if (fromRef.current == null) return;
                e.preventDefault();
                const r = e.currentTarget.getBoundingClientRect();
                const idx = e.clientY < r.top + r.height / 2 ? i : i + 1;
                if (idx !== over) setOver(idx);
              }}
              onDrop={e => {
                e.preventDefault();
                if (fromRef.current != null) {
                  const r = e.currentTarget.getBoundingClientRect();
                  onMove(page.blocks[fromRef.current].id, e.clientY < r.top + r.height / 2 ? i : i + 1);
                }
                end();
              }}
              onDragEnd={end}>
            <span className="adm-grip"><AI n="grip" /></span>
            <button type="button" className="adm-layer-name" onClick={() => onJump(b.id)}>
              <i>{String(i + 1).padStart(2, '0')}</i>{BLOCKS[b.type].name}
            </button>
            <button type="button" className="adm-icon-btn" title={b.hidden ? 'Показать на сайте' : 'Скрыть с сайта'}
                    onClick={() => onHide(b.id)}>
              <AI n={b.hidden ? 'eyeOff' : 'eye'} />
            </button>
          </li>
        ))}
      </ol>
    </aside>
  );
};
