 готовая платформа под ваш бизнес."},{t:"Адаптируем под ваш бренд",d:"Переносим логотип, фирменные цвета и материалы в приложение, чтобы оно выглядело как ваш собственный продукт."},{t:"Собираем приложение",d:"Платформа уже готова — адаптируем её под ваш бизнес, подключаем каталог, заказы и нужные функции."},{t:"Публикуем в App Store и Google Play",d:"Подготавливаем приложение к публикации, отправляем на проверку и размещаем под вашим брендом."},{t:"Передаём готовую систему",d:"Вы получаете приложение, админ-панель и инструменты для команды. Загружаете каталог — и начинаете работать."}],INCLUDED=["Клиентское приложение под вашим брендом","Публикация в App Store и Google Play","Каталог товаров, корзина и онлайн-оплата","Доставка и самовывоз","Бонусы, промокоды и push-уведомления","CRM и клиентская база","Админ-панель и аналитика"],FAQ=[["У меня уже есть сайт и другие каналы продаж — зачем ещё приложение?","Каждый канал выполняет свою задачу. Реклама помогает привлекать новых клиентов, а приложение — возвращать тех, кто уже покупал. Через push-уведомления, бонусы и персональные предложения вы можете напрямую работать с клиентской базой и стимулировать повторные покупки."],["Чем это отличается от разработки приложения с нуля?","При разработке с нуля вы оплачиваете целую команду — аналитика, дизайнера, разработчиков под iOS и Android, тестировщика и менеджера проекта. Они заново пишут каталог, корзину, оплату и бонусную систему — это сотни часов и месяцы работы. У нас платформа уже написана, отлажена и работает в действующем бизнесе — мы разворачиваем её под ваш бренд за 7 дней. Индивидуальная разработка оправдана, когда у бизнеса действительно нестандартная задача."],["Сколько времени занимает запуск?","Само приложение собираем и подготавливаем к публикации за 7 рабочих дней после получения готового дизайна. Дизайн и фирменный стиль предоставляет клиент — мы адаптируем их под платформу и занимаемся сборкой приложения."],["Кто делает дизайн приложения?","Дизайн и фирменный стиль предоставляет клиент. Мы адаптируем готовый дизайн под платформу и собираем на его основе приложение. Если нужно, подскажем, какие материалы подготовить."],["Что нужно от меня для запуска?","Нужны информация о бизнесе, каталог товаров, логотип и фирменный стиль. После получения материалов мы берём сборку и подготовку приложения на себя."],["Я получаю исходный код?","Нет. Вы получаете готовое приложение под своим брендом, админ-панель и необходимые доступы для работы с платформой. Исходный код платформы в стоимость запуска не входит. Если потребуется его выкуп или передача — условия обсуждаются отдельно."],["Обязательно ли платить за поддержку?","Нет. После запуска вы получаете готовое приложение и необходимые доступы и можете управлять платформой самостоятельно. Техническая поддержка подключается по желанию — от 25 000 ₽/мес. в зависимости от объёма задач. Дополнительные функции и доработки рассчитываются отдельно."],["Что если клиенты не станут пользоваться приложением?","До запуска вы можете посмотреть демо и понять, как приложение выглядит для вашего клиента. После запуска привлекать пользователей можно через бонусы, push-уведомления, рекламу и собственные каналы коммуникации. Платформа уже работает в действующем бизнесе в нескольких городах."]],QUIZ_Q=[{t:"Чем занимается ваш бизнес?",h:"Это поможет подобрать подходящий сценарий приложения.",a:["Розничная торговля","Доставка","Интернет-магазин","Производство","Другое"],ic:["bag","bike","laptop","factory","more-horizontal"]},{t:"Как клиенты обычно покупают?",h:"Так мы поймём, какие функции продаж вам нужны в первую очередь.",a:["Через сайт","В магазине","Через менеджеров","Маркетплейсы","Несколько каналов"],ic:["globe","store","headphones","shopping-cart","shuffle"]},{t:"Есть ли у вас повторные покупки?",h:"Покажет, насколько сильно приложение может увеличить повторные продажи.",a:["Да, покупают регулярно","Иногда","Практически нет"]},{t:"Есть ли клиентская база?",h:"От этого зависит, с чего начнётся раб
