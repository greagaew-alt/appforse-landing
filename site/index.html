нкции."},{t:"Публикуем в App Store и Google Play",d:"Подготавливаем приложение к публикации, отправляем на проверку и размещаем под вашим брендом."},{t:"Передаём готовую систему",d:"Вы получаете приложение, админ-панель и инструменты для команды. Загружаете каталог — и начинаете работать."}],INCLUDED=["Клиентское приложение под вашим брендом","Публикация в App Store и Google Play","Каталог товаров, корзина и онлайн-оплата","Доставка и самовывоз","Бонусы, промокоды и push-уведомления","CRM и клиентская база","Админ-панель и аналитика"],FAQ=[["У меня уже есть сайт и другие каналы продаж — зачем ещё приложение?","Каждый канал выполняет свою задачу. Реклама помогает привлекать новых клиентов, а приложение — возвращать тех, кто уже покупал. Через push-уведомления, бонусы и персональные предложения вы можете напрямую работать с клиентской базой и стимулировать повторные покупки."],["Чем это отличается от разработки приложения с нуля?","При разработке с нуля вы оплачиваете целую команду — аналитика, дизайнера, разработчиков под iOS и Android, тестировщика и менеджера проекта. Они заново пишут каталог, корзину, оплату и бонусную систему — это сотни часов и месяцы работы. У нас платформа уже написана, отлажена и работает в действующем бизнесе — мы разворачиваем её под ваш бренд за 7 дней. Индивидуальная разработка оправдана, когда у бизнеса действительно нестандартная задача."],["Сколько времени занимает запуск?","Само приложение собираем и подготавливаем к публикации за 7 рабочих дней после получения готового дизайна. Дизайн и фирменный стиль предоставляет клиент — мы адаптируем их под платформу и занимаемся сборкой приложения."],["Кто делает дизайн приложения?","Дизайн и фирменный стиль предоставляет клиент. Мы адаптируем готовый дизайн под платформу и собираем на его основе приложение. Если нужно, подскажем, какие материалы подготовить."],["Что нужно от меня для запуска?","Нужны информация о бизнесе, каталог товаров, логотип и фирменный стиль. После получения материалов м
